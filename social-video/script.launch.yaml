# 2.0 launch post (VARIANT=launch): the LinkedIn feed video for ERD Studio 2.0. Not committed as
# media: the render lives in renders/ (gitignored) and is uploaded by hand.
#
# The story (Liam, 2026-11-10), the pro cut's arc (script.yaml) with 2.0 facts, the interesting
# part first and getting started last:
#   THE PROBLEM  we've built the data model backwards for decades: drawn for the business in a
#                separate tool, developers work backwards from the picture, it drifts; and an AI
#                can read the SQL but not the design, so it guesses.
#   THE FIX      flip it: the model in the repo as DBML (an open format) next to the SQL; ERD
#                Studio draws it in VS Code and edits go both ways; by hand or with your AI (a
#                built-in skill); a real 2,000-table diagram with its lines routed in the
#                background and the hover flow; one pull request for design + code; ERD Studio
#                for Confluence for the business.
#   GET STARTED  already have a model? (the reverse-engineering nod lives here) every source the
#                import reads on one still logo wall; the DDL out in one step at schema grain
#                (Snowflake GET_DDL, pg_dump); a draft first; dbt as an add-on (Compare); free to
#                use in VS Code.
# Voice only (`music: false`). Per-scene direction: SCENES.launch.md. Scenes reuse the README cut's
# 2.0 modules (readme/flip, readme/canvas, readme/dbt) and the pro cut's hook and ai (their visuals
# carry no file format), with the launch modules for the rest.
#
# Format: exactly as script.yaml (see its header). Wording follows docs/dev/onboarding-and-cli.md
# → "User-facing wording": DBML is "an open format" (never an open standard), ERD Studio is free
# to use and source available (never "open source"), every label on screen is the product's own.
# ERD Studio for Confluence is never called free and has no price. No competitor is named. No
# routing time in seconds anywhere (it depends on the machine). Never "No AI needed".

title: ERD Studio 2.0
maxDuration: 150
# Voice only, like the README cut.
music: false

voice:
  engine: kokoro
  kokoro: af_heart
  speed: 1.06
  say: Karen
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["THE PROBLEM", "THE FIX", "GET STARTED"]

scenes:
  # ---------------------------------------------------------------- THE PROBLEM
  - id: hook
    module: hook                     # the pro cut's: the ERD upside down, turned the right way up on "the fix"
    chapter: 1
    minDur: 5
    accent: amber
    headline: ["We've built data models", "{backwards} for decades."]
    lines:
      - id: h_backwards
        beat: backwards
        caption: For decades, we've built | the data model {backwards}.
      - id: h_loop
        beat: loop
        caption: Here's the fix, | and why your {AI} needs it.

  - id: problem
    module: launch/problem
    chapter: 1
    minDur: 9
    accent: amber
    headline: ["Drawn for the business.", "{Invisible} to the code."]
    lines:
      - id: p_drawn
        beat: drawn
        caption: We draw the logical model | for the business, | in a {separate tool}.
      - id: p_back
        beat: back
        caption: Developers work backwards | from the picture,
      - id: p_drift
        beat: drift
        caption: so the design {drifts}, | and nobody trusts the diagram.

  - id: ai
    module: ai                       # the pro cut's: an assistant reads the SQL, finds no design, guesses
    chapter: 1
    minDur: 8
    accent: blue
    headline: ["Then I tried", "building {with AI}."]
    lines:
      - id: a_vibe
        beat: vibe
        caption: Then I tried | building with {AI}.
      - id: a_blind
        beat: blind
        caption: It could read every line of SQL, | but not the {design}.
      - id: a_guess
        beat: guess
        caption: What's the grain? | Which keys? | It had to {guess}.

  # ---------------------------------------------------------------- THE FIX
  - id: flip
    module: readme/flip
    chapter: 2
    minDur: 7
    accent: green
    headline: ["So flip it.", "Keep it {in the repo}."]
    lines:
      - id: f_repo
        beat: repo
        caption: "So flip it. | Keep the model {in the repo}, | as DBML, an open format, | right next to the SQL."

  - id: canvas
    module: readme/canvas
    chapter: 2
    minDur: 7.6
    accent: blue
    headline: ["The files become", "a {diagram}."]
    lines:
      - id: c_draw
        beat: draw
        caption: ERD Studio draws those files | as a {diagram}, in VS Code.
      - id: c_sync
        beat: sync
        caption: Edit either one, | and the other {follows}.

  - id: aiwrite
    module: launch/aiwrite
    chapter: 2
    minDur: 9
    accent: blue
    headline: ["By hand, or", "{with your AI}."]
    lines:
      - id: w_write
        beat: write
        caption: Edit it {by hand}, | or ask your AI assistant | in plain words. | A built-in {skill} teaches it the format, | and the new table appears | on the canvas.

  - id: scale
    module: launch/scale
    chapter: 2
    minDur: 13.8          # the arrows keep flowing a moment after "to the many"
    accent: blue
    props:
      poster: { beat: hover, offset: 3.4 }   # thumb.mjs: the poster, the hover's gold flowing lines
    headline: ["Built for", "{big models}."]
    lines:
      - id: s_big
        beat: big
        caption: "And it's built for big models: | {2,000 tables}, | every line routed around them | in the background."
        say: "And it's built for big models: two thousand tables, every line routed around them in the background."
      - id: s_hover
        beat: hover
        pause: 0.7
        caption: Point at a table, | and arrows flow along | its {relationships}, | from the one side to the many.

  - id: pr
    module: launch/pr
    chapter: 2
    minDur: 8
    accent: green
    headline: ["One pull request,", "{design + code}."]
    lines:
      - id: pr_same
        beat: same
        caption: The design change and the SQL | go in the {same pull request}.
      - id: pr_review
        beat: review
        caption: Reviewed together. | Shipped together.
      - id: pr_why
        beat: why
        pause: 0.4
        caption: Why did this take us {decades}?

  - id: confluence
    module: launch/confluence
    chapter: 2
    minDur: 9
    accent: blue
    headline: ["For the business:", "view it in {Confluence}."]
    lines:
      - id: c_app
        beat: app
        caption: "And the business still gets its diagram: | {ERD Studio for Confluence} | reads the same DBML | from {GitHub},"
      - id: c_view
        beat: view
        caption: so business users can | view the data model there, | {no VS Code} needed.

  # ---------------------------------------------------------------- GET STARTED
  - id: wall
    module: launch/wall
    chapter: 3
    minDur: 22
    accent: amber
    props:
      poster: { beat: same, offset: 1.0 }    # thumb.mjs --scene wall: the secondary still
    headline: ["Already have a model?", "{Bring it in}."]
    lines:
      - id: w_have
        beat: have
        caption: "Already have a model? | Everyone's reverse-engineering | apps with AI: | start with {your data model}."
      - id: w_list
        beat: list
        caption: "Bring it in from dbt, Databricks, | Snowflake, Power BI and Fabric, | PostgreSQL, SQL Server, MySQL, | Oracle, BigQuery, Redshift, | MariaDB, SQLite, | or DBML."
        say: "Bring it in from dbt, Databricks, Snowflake, Power BI and Fabric, PostgreSQL, SQL Server, MySQL, Oracle, BigQuery, Redshift, MariaDB, SQLite, or D B M L."
      - id: w_same
        beat: same
        pause: 0.5
        caption: Whichever you start from, | it lands as the same {DBML files}.

  - id: export
    module: launch/export
    chapter: 3
    minDur: 8
    accent: blue
    headline: ["Getting it out?", "{One step}."]
    lines:
      - id: x_one
        beat: one
        caption: "Getting it out is one step: | one query in {Snowflake}, | one command in {PostgreSQL}."
      - id: x_whole
        beat: whole
        caption: A {whole schema} at a time, | in one .sql file.
        say: "A whole schema at a time, in one dot S Q L file."

  - id: draft
    module: launch/draft
    chapter: 3
    minDur: 7.5
    accent: amber
    headline: ["A {draft} first,", "then DBML in Git."]
    lines:
      - id: d_import
        beat: import
        caption: "{Import…} shows you | a {draft} first."
        say: "Import shows you a draft first."
      - id: d_keep
        beat: keep
        caption: "{Keep as Diagram}, | and it's DBML files in your repo."

  - id: dbt
    module: readme/dbt
    chapter: 3
    minDur: 8
    accent: green
    headline: ["Using dbt?", "{Compare} with your design."]
    lines:
      - id: d_open
        beat: open
        caption: Using dbt? | The {Physical} tab | shows what it builds, read-only,
      - id: d_compare
        beat: compare
        caption: "and {Compare with dbt} marks | every difference from your design, | before it ships."

  - id: end
    module: endCard
    chapter: 0
    minDur: 6
    accent: green
    headline: null
    props:
      tagline: ["Your data model, ", "in Git."]
      pills: ["Free to use in VS Code", "Source available"]
      pillWords: ["free", "source"]
      link: { text: Also on Open VSX, chevron: false }
    lines:
      - id: e_name
        beat: name
        caption: ERD Studio is {free to use} | in VS Code, | source available on GitHub.
      - id: e_cta
        beat: cta
        caption: Search {ERD Studio} | in the VS Code Extensions view.
