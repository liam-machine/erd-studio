<!DOCTYPE html>
<!--
  LinkedIn explainer player. Served from the repo root by ../serve.mjs (so /media/icon.png
  and /social-video/build/timeline.json resolve):
    capture:  capture.mjs calls window.render(t) for every frame
    preview:  http://localhost:4173/social-video/player/index.html?preview=1   (click to play with narration)
    one frame http://localhost:4173/social-video/player/index.html?t=42.5
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ERD Studio — explainer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="kicker" id="kicker"></div>
  <div class="headline" id="headline"></div>
  <div class="stage" id="stage"></div>
  <div class="caption" id="caption"></div>
  <div class="chapters" id="chapters"></div>
  <div class="preview-hud" id="hud" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
