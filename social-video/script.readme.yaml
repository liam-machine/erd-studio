# README cut: "How ERD Studio works" (VARIANT=readme), committed as docs/assets/how-it-works.mp4.
# A DBML-first tour of the logical model for README visitors: why the model belongs in Git, the
# DBML files behind the canvas (layer-first: <layer>/tables/<schema>/<table>.dbml,
# <layer>/relationships/<layer>.dbml, <layer>/diagrams/<diagram>.dbml), editing either side, a
# .dbml diff in a pull request, your own AI assistant, the ways to start (dbt, Power BI, SQL
# scripts, DBML) and export, dbt as a short beat, and ERD Studio for Confluence for readers without
# VS Code. Voice only: no music bed (`music: false`). Per-scene direction: SCENES.readme.md. The scenes are player/scenes/readme/*.js (plus the
# shared endCard); the example they all draw is STORY in player/scenes/readme/story.js.
#
# Format: exactly as script.yaml (see its header). Wording follows docs/dev/onboarding-and-cli.md
# → "User-facing wording": DBML is "an open format" (never an open standard), ERD Studio is free
# to use and source available (never "open source"), "diagram", "Set Up My AI Helper", and every
# label on screen is the product's own (src/types/startActions.ts, package.json, the webview).

title: How ERD Studio works
maxDuration: 112
# Voice only (Liam, 2026-11-05): music.py writes no bed for this cut and encode.sh mixes none.
music: false

voice:
  engine: kokoro        # kokoro | say
  kokoro: af_heart      # same voice as the getting-started video
  speed: 1.06          # a touch brisker than the getting-started video
  say: Karen
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["WHY", "DBML", "EDIT", "AI", "IMPORT", "DBT", "SHARE"]

scenes:
  - id: hook
    module: readme/hook
    chapter: 1
    minDur: 8
    accent: amber
    headline: ["Where does your", "data model {live}?"]
    lines:
      - id: h_design
        beat: design
        caption: "Your logical data model | is the {design}: | the tables, their grain, | keys and joins."
      - id: h_apart
        beat: apart
        caption: Usually it lives | in a {separate tool}. | It drifts from the code, | and your AI can't see it.

  - id: flip
    module: readme/flip
    chapter: 1
    minDur: 5
    accent: green
    headline: ["So keep it", "{next to the code}."]
    lines:
      - id: f_repo
        beat: repo
        caption: ERD Studio keeps it {in Git}, | right next to the code.

  - id: tree
    module: readme/tree
    chapter: 2
    minDur: 8.5
    accent: blue
    headline: ["Plain {DBML} files,", "an open format."]
    lines:
      - id: t_dbml
        beat: dbml
        caption: It's stored as {DBML}, | an open format, | so there's no lock-in.
      - id: t_files
        beat: files
        caption: "Each layer has a folder: | {one file per table}, | the relationships, | and the diagrams."

  - id: files
    module: readme/files
    chapter: 2
    minDur: 9
    accent: blue
    headline: ["One table,", "{one file}."]
    lines:
      - id: fi_table
        beat: table
        caption: A table file holds | its {columns}, keys and grain.
      - id: fi_ref
        beat: ref
        caption: Each relationship is | {one Ref line},
      - id: fi_layout
        beat: layout
        caption: and a diagram file keeps | its tables' {positions}.

  - id: canvas
    module: readme/canvas
    chapter: 3
    minDur: 10
    accent: blue
    props:
      poster: { beat: keep, offset: 1.5 }   # thumb.mjs: the README poster frame
    headline: ["The files become", "a {diagram}."]
    lines:
      - id: c_draw
        beat: draw
        caption: ERD Studio draws the files | as a {diagram}, in VS Code.
      - id: c_sync
        beat: sync
        caption: Edit the canvas or the file, | and the other {follows}.
      - id: c_keep
        beat: keep
        caption: Your comments | and hand edits {stay}.

  - id: pr
    module: readme/pr
    chapter: 3
    minDur: 7
    accent: green
    headline: ["A design change,", "a {readable diff}."]
    lines:
      - id: pr_diff
        beat: diff
        caption: So a design change | is a small, {readable diff},
      - id: pr_same
        beat: same
        caption: in the {same pull request} | as the code that builds it.

  - id: ai
    module: readme/ai
    chapter: 4
    minDur: 11
    accent: blue
    headline: ["Your AI writes", "{the same files}."]
    lines:
      - id: ai_setup
        beat: setup
        caption: "{Set Up My AI Helper} | teaches your assistant these files: | Claude Code, Copilot, Codex, | Gemini CLI or Cursor."
      - id: ai_write
        beat: write
        caption: Your assistant writes | the same {DBML}, | and you see its change | on the canvas | before you commit.

  - id: import
    module: readme/import
    chapter: 5
    minDur: 10
    accent: amber
    headline: ["Bring in", "{what you have}."]
    lines:
      - id: im_from
        beat: from          # the Diagrams view's Draw from dbt, then the Import… picker on "import"
        caption: Already have a model? | Draw it from {dbt}, or import | {Power BI}, {SQL scripts} or {DBML}.
      - id: im_draft
        beat: draft
        pause: 0.6          # the SQL scripts stay picked, their dialects lit, before the draft
        caption: "You see a {draft} first: | nothing is written | until you keep it."
      - id: im_export
        beat: export
        caption: And {export} DBML or Mermaid | any time.

  - id: dbt
    module: readme/dbt
    chapter: 6
    minDur: 10
    accent: green
    headline: ["Using dbt?", "Compare {what dbt has}."]
    lines:
      - id: d_open
        beat: open
        caption: Using {dbt}? Open the project, | and a read-only {Physical} tab | shows what dbt has.
      - id: d_compare
        beat: compare
        caption: "{Compare with dbt} | marks every difference."

  - id: confluence
    module: readme/confluence
    chapter: 7
    minDur: 10.6        # "No VS Code needed" holds ~2 s before the end card
    accent: blue
    headline: ["For the business:", "view it in {Confluence}."]
    lines:
      - id: cf_app
        beat: app
        caption: "For business users: | {ERD Studio for Confluence}, | on the Atlassian Marketplace,"
      - id: cf_view
        beat: view
        caption: shows your diagrams | from {GitHub} in Confluence, | no VS Code needed.

  - id: end
    module: endCard
    chapter: 0
    minDur: 6
    accent: green
    headline: null
    props:
      tagline: ["Design your data model ", "in Git."]
      pills: ["Free to use", "Source available"]
      link: { text: Also on Open VSX, chevron: false }
    lines:
      - id: e_name
        beat: name
        caption: ERD Studio for VS Code. | {Free to use}, | source available on GitHub.
      - id: e_cta
        beat: cta
        caption: Search {ERD Studio} | in the VS Code Extensions view.
