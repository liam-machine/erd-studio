modules:
  macro:
    - key: erd-studio-macro
      resource: main-resource
      resolver:
        function: resolver
      title: ERD Studio
      description: Interactive entity-relationship diagram viewer
      layout: block
      categories:
        - visuals
  function:
    - key: resolver
      handler: index.handler
      providers:
        auth:
          - github
providers:
  auth:
    - key: github
      name: GitHub
      type: oauth2
      clientId: Ov23ctA25E7CrdmLZXpv
      scopes:
        - repo
      remotes:
        - github-api
      bearerMethod:
        type: authorization-header
      actions:
        authorization:
          remote: github-main
          path: /login/oauth/authorize
        exchange:
          remote: github-main
          path: /login/oauth/access_token
          resolvers:
            accessToken: access_token
          overrides:
            headers:
              Accept: application/json
        retrieveProfile:
          remote: github-api
          path: /user
          resolvers:
            id: id
            displayName: login
            avatarUrl: avatar_url
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/aa70d9de-2e23-4be4-94fa-6a24740dde2d
remotes:
  - key: github-main
    baseUrl: https://github.com
  - key: github-api
    baseUrl: https://api.github.com
resources:
  - key: main-resource
    path: static/frontend/build
    tunnel:
      port: 5173
permissions:
  scopes:
    - read:confluence-content.summary
    - storage:app
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      backend:
        - 'https://github.com'
        - 'https://api.github.com'
