modules:
  macro:
    - key: erd-studio-macro
      resource: main-resource
      resolver:
        function: resolver
      title: ERD Studio
      description: Interactive entity-relationship diagram viewer
      layout: block
      categories:
        - visuals
  function:
    - key: resolver
      handler: index.handler
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/aa70d9de-2e23-4be4-94fa-6a24740dde2d
resources:
  - key: main-resource
    path: static/frontend/build
    tunnel:
      port: 5173
permissions:
  scopes:
    - read:confluence-content.summary
    - storage:app
  content:
    styles:
      - unsafe-inline
  external:
    fetch:
      backend:
        - raw.githubusercontent.com
        - api.github.com
