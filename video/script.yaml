# Getting-started video: the DEFAULT cut, and the single source of truth for its format. The
# README links it (docs/assets/getting-started.mp4) and the Welcome panel plays it in a dbt project
# (its 'dbt' page). It is a RECORDING OF THE REAL VS CODE, in its light theme: ERD Studio built from
# this checkout, driven by record/ in an isolated window, the footage set into the light frame
# below the headline and above the chapter bar (`recording.inset`). See README.md, "Recording".
#
# The story: most teams already have a data model, so it starts by bringing one in (Import…, the
# Snowflake DDL a project folder holds, its draft, Keep as Diagram), then the DBML files that saves
# next to the code, an edit by hand, the same kind of edit by Claude Code (Set Up My AI Helper's
# skill, its pre-tool hook, the diagram updating), what it changed (held: the lines it wrote, the new
# table on the canvas), that change and the code that builds it in one pull request, what a dbt
# project adds (Import from dbt, Run dbt parse, the Physical tab, Compare with dbt), and ERD Studio
# for Confluence showing the diagram from the repo.
#
# Each scene has a headline (two lines; `{word}` is highlighted in the scene's accent colour),
# the player module that draws its frame (rec/window: the window the footage plays in, and the
# props it draws beside it; tour/aiChange, tour/pullRequest, tour/confluence and the end card are HTML), narration lines, and
# `minDur`, which leaves the real UI time to do what the line says. record/scenes.mjs performs each
# scene's clicks on its beats.
#
# A line is:
#   id       stable file name for its voice clip (build/voice/<id>.wav) and cue
#   beat     name the recording keys its actions off (beats.<name>.t / .end, seconds from scene
#            start, taken from the REAL audio duration)
#   caption  what the viewer reads (captions, transcript) — Australian spelling
#   say      optional: what the voice reads, when it must differ from the caption
#            (pronunciation respellings — see the table in README.md)
#   pause    optional: silence before this line instead of timing.gap
#
# Timing (build-timeline.mjs): a scene starts where the previous one ended; its first line
# starts `lead` seconds in; each further line follows `gap` seconds after the previous one;
# the scene lasts max(minDur, lastLineEnd + tail).
#
# Words to keep out of every scene but the dbt beat (id dbt) and the import (id bring, which names
# dbt among the tools a data model already lives in): dbt, Physical, Diff, manifest, sample
# project — in narration, captions, headlines and anything on screen. `npm test` checks the file and
# the text the recording saw on screen (record/takes.json). Never "No AI needed": the tour shows
# both ways, by hand and with an AI assistant.
#
# Length: 80–140 s (maxDuration 140); the product calls it "Watch the Tour", with no length in
# its name.

title: ERD Studio — getting started
maxDuration: 140

# The recorded window's place in the 1920x1080 frame (frame px). The isolated VS Code window is
# 1440x600 CSS px (record/vscode.mjs WINDOW) rendered at 2x (DPR), filmed scaled down to fill this rect exactly.
recording:
  inset: { x: 96, y: 240, w: 1728, h: 720 }
  # A punch-in (record/composite.mjs): from `beat` + `offset` in `scene`, the region around `focus`
  # (inset px) dissolves in at `scale`x and holds to the scene's end. Here: the comparison's marks
  # and its panel, whose small text needs it.
  zoom: { scene: dbt, beat: compare, offset: 1.6, dur: 0.5, scale: 1.45, focus: [1400, 430] }

voice:
  engine: kokoro        # kokoro | say
  kokoro: af_heart      # Kokoro v1.0 voice id (Apache-2.0)
  speed: 1.04
  say: Karen            # macOS fallback voice (en-AU)
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["1 · IMPORT", "2 · SAVE", "3 · EDIT", "4 · COMPARE", "5 · SHARE"]

scenes:
  - id: hook
    module: rec/window
    chapter: 0
    minDur: 6
    accent: blue
    headline: ["Your data model,", "in {your repo}."]
    # the finished diagram beside its files; the claims sit right of the headline (beat, seconds after it)
    props:
      claims: [['DBML files in Git', model, 2.6], ['By hand or with AI', ai, 0.6]]
    lines:
      - id: h_model
        beat: model
        caption: Your data model as a diagram, saved as DBML files in your repo.
      - id: h_ai
        beat: ai
        caption: Edit it by hand, or with your AI assistant, through a built-in skill it uses by itself.

  - id: bring
    module: rec/window
    chapter: 1
    minDur: 9.2
    accent: blue
    headline: ["Already have a model?", "{Bring it in}."]
    # the tools a data model already lives in, each lit as the line names it (seconds after the beat)
    props:
      logos: [[snowflake, have, 1.6], [databricks, have, 2.3], [dbt, have, 3.0], [powerBiFabric, have, 3.4], [sql, have, 4.6]]
    lines:
      - id: b_have
        beat: have
        caption: Most teams already have one, in Snowflake, Databricks, dbt, Power BI, Fabric or SQL.
      - id: b_open
        beat: open
        caption: Open your project, and click Import.

  - id: importSql
    module: rec/window
    chapter: 1
    minDur: 9
    accent: blue
    headline: ["Snowflake or Databricks?", "Import the {DDL}."]
    lines:
      - id: s_sources
        beat: sources
        caption: Import reads DBML, SQL scripts, or a Power BI or Fabric model.
      - id: s_ddl
        beat: ddl
        caption: From Snowflake or Databricks, import the exported DDL. It works out the dialect.

  - id: draft
    module: rec/window
    chapter: 1
    minDur: 6
    accent: blue
    headline: ["Nothing is saved", "until {you keep it}."]
    lines:
      - id: d_draft
        beat: draft
        caption: You get a draft of every table and relationship.
      - id: d_keep
        beat: keep
        pause: 0.9
        caption: Keep it, and it's your diagram.

  - id: files
    module: rec/window
    chapter: 2
    minDur: 9.276   # the length the take was filmed for (f_review was reworded shorter after it; record/takes.json)
    accent: blue
    headline: ["Saved as {DBML},", "next to your code."]
    lines:
      - id: f_files
        beat: files
        caption: Each table is now a DBML file, an open format, next to the code that builds it.
      - id: f_review
        beat: review
        caption: Change it, and Git shows exactly what changed.

  - id: byHand
    module: rec/window
    chapter: 3
    minDur: 7
    accent: blue
    headline: ["Edit it {by hand},", "on the canvas."]
    lines:
      - id: e_hand
        beat: hand
        caption: Edit it by hand, on the canvas. Add a table, with starter columns if you like, and lay it out.
      - id: e_save
        beat: save
        caption: Every edit is saved to its file.

  - id: aiSetup
    module: rec/window
    chapter: 3
    minDur: 7
    accent: blue
    headline: ["Or ask your", "{AI assistant}."]
    # the assistants Set Up My AI Helper sets up (src/types/aiAssistants.ts AI_ASSISTANTS, its names),
    # each lit after "teach your assistant" (beat, seconds after it). Shown, not said: the narration
    # stays on Claude Code, and nothing claims the pre-tool hook for the others.
    props:
      assistants: [skill, 2.4, ['Claude Code', 'GitHub Copilot', 'Codex', 'Gemini CLI', 'Cursor']]
    lines:
      - id: a_or
        beat: or
        caption: Or ask your AI assistant. Click Set Up My AI Helper.
      - id: a_skill
        beat: skill
        caption: "It adds a skill: plain markdown files that teach your assistant ERD Studio's format."

  - id: aiRun
    module: rec/window
    chapter: 3
    minDur: 15.5   # the new table holds on screen, in the open, for about 2 s after its line
    accent: blue
    headline: ["Ask for a change.", "{Watch it appear}."]
    # The wait for Claude Code is sped up (record/scenes.mjs marks it; composite.mjs shows a "sped up"
    # badge over the footage while it is): `fastForward.until` is where, in this scene's time, the
    # footage is back to real time.
    props:
      fastForward: { until: [live, 0.8] }
    lines:
      - id: r_ask
        beat: ask
        caption: Ask Claude Code for a change, in plain words.
      - id: r_hook
        beat: hook
        pause: 0.5
        caption: It loads the ERD Studio skill by itself, and a pre-tool hook makes sure it has, before any edit,
      - id: r_live
        beat: live
        caption: so what it writes is a diagram you can see, right away.

  - id: aiShow
    module: tour/aiChange
    chapter: 3
    minDur: 9.6    # the change held: what it wrote, then the canvas punched in on the new table, about 1.9 s in silence after its last line
    accent: blue
    headline: ["See what it {changed}:", "in the {files}, on the {canvas}."]
    # a still of aiRun's last frame where the footage was (composite.mjs cuts to it with no fade;
    # player/assets/still-aiRun.jpg, `npm run still`), then the lines Claude Code wrote (its own
    # edits, word for word: record/takes.json) and the new table and its relationship, punched in
    props:
      still: aiRun
    lines:
      - id: w_files
        beat: files
        caption: "Here's the change: a new table file, and the line that links it to the orders table."
      - id: w_canvas
        beat: canvas
        caption: On the canvas, the new table and its relationship.

  - id: pr
    module: tour/pullRequest
    chapter: 3
    minDur: 8.6    # the review held after its last line
    accent: blue
    headline: ["One pull request:", "the {design} and the {code}."]
    # a code review's Files changed: the .dbml lines Claude Code wrote beside the SQL that builds the
    # table (pipelines/, the project's own code folder), one pull request
    lines:
      - id: p_one
        beat: one
        caption: The design change goes in the same pull request as the code that builds it,
      - id: p_review
        beat: review
        caption: so your team reviews both together.

  - id: dbt
    module: rec/window
    chapter: 4
    # a separate take, in a dbt project (record/fixtures.mjs): the scene that shows dbt. Import from dbt
    # (the side bar's New… menu) is how a dbt project becomes a diagram; Run dbt parse, the Physical
    # tab (held while its line plays and the pause after it) and Compare with dbt check a design
    # against the project.
    minDur: 14
    accent: green
    headline: ["Using dbt?", "{Import} from it, {compare} with it."]
    props:
      fastForward: { until: [physical, 0] }
    lines:
      - id: k_draw
        beat: draw
        caption: Using dbt? Import from dbt turns your models into a diagram.
      - id: k_parse
        beat: parse
        caption: To check your design against them, click Run dbt parse.
      - id: k_manifest
        beat: manifest
        caption: It writes manifest.json, a description of every model your project builds.
      - id: k_physical
        beat: physical
        caption: The Physical tab shows what it describes, as a diagram.
      - id: k_compare
        beat: compare
        pause: 1.2
        caption: Compare with dbt marks every difference from your design.

  - id: confluence
    module: tour/confluence
    chapter: 5
    minDur: 13.3   # about 1.3 s after its last line: the page and its pills hold before the end card
    accent: blue
    headline: ["One source of truth:", "{your repo}."]
    lines:
      - id: c_truth
        beat: truth
        caption: "Your repo is the single source of truth: just DBML files, no modelling database."
      - id: c_confluence
        beat: confluence
        caption: ERD Studio for Confluence reads them from GitHub, and shows the diagram to business users.

  - id: end
    module: tour/endCard
    chapter: 0
    minDur: 5.2    # a silent hold of about 2.4 s on the end card after its line
    accent: green
    headline: null
    lines:
      - id: x_cta
        beat: cta
        caption: ERD Studio is free to use in VS Code.
