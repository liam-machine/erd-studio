# Getting-started video: the DEFAULT cut, and the single source of truth for its format. The
# README links it (docs/assets/getting-started.mp4) and the Welcome panel plays it in a dbt project
# (its 'dbt' page). It is the one-minute DBML tour of the logical model, the same tour as
# script.logical.yaml scene for scene, with one more short beat before the end card: what a dbt
# project adds (the Physical tab, Compare with dbt).
#
# Each scene has a headline (two lines; `{word}` is highlighted in the scene's accent colour),
# the player module that draws it (player/scenes/<module>.js) and narration lines.
#
# A line is:
#   id       stable file name for its voice clip (build/voice/<id>.wav) and cue
#   beat     name the scene module keys its animation off (beats.<name>.t / .end, seconds
#            from scene start, taken from the REAL audio duration)
#   caption  what the viewer reads (captions, transcript) — Australian spelling
#   say      optional: what the voice reads, when it must differ from the caption
#            (pronunciation respellings — see the table in README.md)
#   pause    optional: silence before this line instead of timing.gap
#
# Timing (build-timeline.mjs): a scene starts where the previous one ended; its first line
# starts `lead` seconds in; each further line follows `gap` seconds after the previous one;
# the scene lasts max(minDur, lastLineEnd + tail).
#
# Words to keep out of every scene but the dbt beat (module dbt/*): dbt, Physical, Diff, manifest,
# sample project — in narration, captions, headlines and anything drawn on screen. dbt is an
# add-on: it shows up only at the end. `npm test` checks the file, the modules and the frames.
#
# Length: 50–60 s, at most 65 s (maxDuration): the product calls it the "One-Minute Tour".

title: ERD Studio — getting started
maxDuration: 65

voice:
  engine: kokoro        # kokoro | say
  kokoro: af_heart      # Kokoro v1.0 voice id (Apache-2.0)
  speed: 1.04
  say: Karen            # macOS fallback voice (en-AU)
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["1 · OPEN", "2 · DRAW", "3 · SAVE", "4 · ENRICH"]

scenes:
  - id: hook
    module: tour/hook
    chapter: 0
    minDur: 5
    accent: blue
    headline: ["Your data model,", "in {your repo}."]
    lines:
      - id: h_model
        beat: model
        caption: Your data model, as a diagram, saved as DBML files in your repo.
      - id: h_noai
        beat: noai
        caption: No AI needed, and nothing to configure.

  - id: install
    module: tour/install
    chapter: 1
    minDur: 6.4
    accent: blue
    headline: ["Install it, open a folder,", "click {its icon}."]
    lines:
      - id: i_install
        beat: install
        caption: Install ERD Studio, open your folder, and click its icon.

  - id: newDiagram
    module: tour/newDiagram
    chapter: 2
    minDur: 4.4
    accent: blue
    headline: ["Click {New Diagram}.", "Give it a name."]
    lines:
      - id: n_click
        beat: click
        caption: Click New Diagram,
      - id: n_name
        beat: name
        caption: and give it a name.

  - id: tables
    module: tour/tables
    chapter: 2
    minDur: 7.2
    accent: blue
    headline: ["Add tables,", "then {connect them}."]
    lines:
      - id: t_table
        beat: table
        caption: Add a table, with starter columns if you like.
      - id: t_more
        beat: more
        caption: Add another, then link the two with a relationship.

  - id: files
    module: tour/files
    chapter: 3
    minDur: 5.4
    accent: blue
    headline: ["Saved as {DBML},", "plain files in Git."]
    lines:
      - id: f_files
        beat: files
        caption: Each table is a DBML file, to commit and review like code.

  - id: importDbml
    module: tour/importDbml
    chapter: 3
    minDur: 7.0
    accent: blue
    headline: ["DBML out,", "and {DBML in}."]
    lines:
      - id: m_export
        beat: export
        caption: Export to DBML or Mermaid any time.
      - id: m_import
        beat: import
        caption: Already have DBML? Import it, then keep the draft.

  - id: enrich
    module: tour/enrich
    chapter: 4
    minDur: 8.8
    accent: blue
    headline: ["Want the why?", "Ask your {AI assistant}."]
    lines:
      - id: e_want
        beat: want
        caption: Want grain, keys and the why behind each table?
      - id: e_setup
        beat: setup
        caption: Click Set Up My AI Helper, then type /erd-studio-setup in your assistant.
        say: Click Set Up My AI Helper, then type slash ERD studio setup in your assistant.

  - id: dbt
    module: dbt/compare
    chapter: 0            # after the last chapter: the bar shows every chapter done (main.js)
    minDur: 8.0
    accent: green
    headline: ["Using dbt?", "{Compare} with what it has."]
    lines:
      - id: k_tabs
        beat: tabs
        caption: Using dbt? Then a Physical tab shows what dbt has.
      - id: k_compare
        beat: compare
        caption: Click Compare with dbt to mark every difference.

  - id: end
    module: tour/endCard
    chapter: 0
    minDur: 4.6
    accent: green
    headline: null
    lines:
      - id: x_cta
        beat: cta
        caption: ERD Studio is free to use. Install it today.
