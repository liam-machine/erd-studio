# Getting-started video: the single source of truth.
#
# Each scene has a headline (two lines; `{word}` is highlighted in the scene's accent colour),
# the player module that draws it (player/scenes/<module>.js) and narration lines.
#
# A line is:
#   id       stable file name for its voice clip (build/voice/<id>.wav) and cue
#   beat     name the scene module keys its animation off (beats.<name>.t / .end, seconds
#            from scene start, taken from the REAL audio duration)
#   caption  what the viewer reads (captions, transcript) — Australian spelling
#   say      optional: what the voice reads, when it must differ from the caption
#            (pronunciation respellings — see the table in README.md)
#   pause    optional: silence before this line instead of timing.gap
#
# Timing (build-timeline.mjs): a scene starts where the previous one ended; its first line
# starts `lead` seconds in; each further line follows `gap` seconds after the previous one;
# the scene lasts max(minDur, lastLineEnd + tail).

title: ERD Studio — getting started
maxDuration: 65

voice:
  engine: kokoro        # kokoro | say
  kokoro: af_heart      # Kokoro v1.0 voice id (Apache-2.0)
  speed: 1.04
  say: Karen            # macOS fallback voice (en-AU)
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["1 · OPEN", "2 · DRAW", "3 · EXPLORE", "4 · ENRICH"]

scenes:
  - id: hook
    module: hook
    chapter: 0
    minDur: 5
    accent: blue
    headline: ["Your dbt project,", "as a {diagram}."]
    lines:
      - id: h_minute
        beat: minute
        caption: Your dbt project, as a diagram, in about a minute.
      - id: h_noai
        beat: noai
        caption: No AI, and nothing to configure.

  - id: install
    module: install
    chapter: 1
    minDur: 6
    accent: blue
    headline: ["Install it, and a guide", "{opens by itself}."]
    lines:
      - id: i_install
        beat: install
        caption: Install ERD Studio, and open your dbt project.
      - id: i_guide
        beat: guide
        caption: The Get started guide opens by itself.

  - id: draw
    module: draw
    chapter: 2
    minDur: 5.8
    accent: blue
    headline: ["Click {Draw from dbt}.", "Pick a folder."]
    lines:
      - id: d_click
        beat: click
        caption: Click Draw from dbt,
      - id: d_pick
        beat: pick
        caption: and pick a folder, like your marts.

  - id: canvas
    module: canvas
    chapter: 2
    minDur: 6.0
    accent: blue
    headline: ["Your models and tests,", "{laid out for you}."]
    lines:
      - id: c_reads
        beat: reads
        caption: It reads your models and their relationship tests,
      - id: c_layout
        beat: layout
        caption: and lays out the diagram for you.

  - id: design
    module: design
    chapter: 3
    minDur: 8
    accent: blue
    headline: ["That's your", "{Logical} design."]
    lines:
      - id: g_design
        beat: design
        caption: That's your Logical design.
      - id: g_click
        beat: click
        caption: Click a table to see its columns and keys.
      - id: g_files
        beat: files
        caption: It's saved as plain files in your repo, next to your SQL.

  - id: physical
    module: physical
    chapter: 3
    minDur: 7
    accent: green
    headline: ["Physical shows what", "{dbt actually built}."]
    lines:
      - id: p_switch
        beat: switch
        caption: Switch to Physical to see what dbt actually built.
      - id: p_diff
        beat: diff
        caption: Diff compares the two, and flags anywhere they disagree.

  - id: enrich
    module: enrich
    chapter: 4
    minDur: 9.3
    accent: blue
    headline: ["Want the why?", "Ask your {AI assistant}."]
    lines:
      - id: e_want
        beat: want
        caption: Want grain, keys and the why behind each table?
      - id: e_setup
        beat: setup
        caption: Click Set Up My AI Helper, then type /erd-studio-setup in your assistant.
        say: Click Set Up My AI Helper, then type slash ERD studio setup in your assistant.

  - id: sample
    module: sample
    chapter: 0            # after the last chapter: the bar shows every chapter done (main.js)
    minDur: 4.9
    accent: green
    headline: ["No dbt project?", "Try the {sample}."]
    lines:
      - id: s_sample
        beat: sample
        caption: No dbt project? Try the sample project.

  - id: end
    module: endCard
    chapter: 0
    minDur: 5
    accent: green
    headline: null
    lines:
      - id: x_cta
        beat: cta
        caption: ERD Studio is free. Install it, and draw your dbt project today.
