# Getting-started video, the LOGICAL cut (VARIANT=logical): the one-minute DBML tour of the
# logical model for a folder without dbt. The Welcome panel plays it where there is no
# dbt_project.yml (its 'logical' and 'nofolder' pages). script.yaml is the same tour with one more
# beat, about dbt, before its end card: the two share every other scene.
#
# Format: exactly as script.yaml (see its header). Every scene module here is in player/scenes/tour/.
#
# Words to keep OUT of this file and every tour scene (narration, captions, headlines, props,
# and anything drawn on screen): dbt, Physical, Diff, manifest, sample project. `npm test` checks
# the file, the modules and the rendered frames. "DBML", "Git", "repo", "AI" and "table" are fine.
#
# Length: at most 65 s (maxDuration). The walkthrough's watchLogical step and the Help & Feedback
# view call this the "One-Minute Tour"; keep it between 50 and 60 s.

title: ERD Studio — getting started, logical cut
maxDuration: 65

voice:
  engine: kokoro        # same voice and speed as script.yaml
  kokoro: af_heart
  speed: 1.04
  say: Karen
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["1 · OPEN", "2 · DRAW", "3 · SAVE", "4 · ENRICH"]

scenes:
  - id: hook
    module: tour/hook
    chapter: 0
    minDur: 5
    accent: blue
    headline: ["Your data model,", "in {your repo}."]
    lines:
      - id: h_model
        beat: model
        caption: Your data model, as a diagram, saved as DBML files in your repo.
      - id: h_noai
        beat: noai
        caption: No AI needed, and nothing to configure.

  - id: install
    module: tour/install
    chapter: 1
    minDur: 6.4
    accent: blue
    headline: ["Install it, open a folder,", "click {its icon}."]
    lines:
      - id: i_install
        beat: install
        caption: Install ERD Studio, open your folder, and click its icon.

  - id: newDiagram
    module: tour/newDiagram
    chapter: 2
    minDur: 4.4
    accent: blue
    headline: ["Click {New Diagram}.", "Give it a name."]
    lines:
      - id: n_click
        beat: click
        caption: Click New Diagram,
      - id: n_name
        beat: name
        caption: and give it a name.

  - id: tables
    module: tour/tables
    chapter: 2
    minDur: 7.2
    accent: blue
    headline: ["Add tables,", "then {connect them}."]
    lines:
      - id: t_table
        beat: table
        caption: Add a table, with starter columns if you like.
      - id: t_more
        beat: more
        caption: Add another, then link the two with a relationship.

  - id: files
    module: tour/files
    chapter: 3
    minDur: 5.4
    accent: blue
    headline: ["Saved as {DBML},", "plain files in Git."]
    lines:
      - id: f_files
        beat: files
        caption: Each table is a DBML file, to commit and review like code.

  - id: importDbml
    module: tour/importDbml
    chapter: 3
    minDur: 7.0
    accent: blue
    headline: ["DBML out,", "and {DBML in}."]
    lines:
      - id: m_export
        beat: export
        caption: Export to DBML or Mermaid any time.
      - id: m_import
        beat: import
        caption: Already have DBML? Import it, then keep the draft.

  - id: enrich
    module: tour/enrich
    chapter: 4
    minDur: 8.8
    accent: blue
    headline: ["Want the why?", "Ask your {AI assistant}."]
    lines:
      - id: e_want
        beat: want
        caption: Want grain, keys and the why behind each table?
      - id: e_setup
        beat: setup
        caption: Click Set Up My AI Helper, then type /erd-studio-setup in your assistant.
        say: Click Set Up My AI Helper, then type slash ERD studio setup in your assistant.

  - id: end
    module: tour/endCard
    chapter: 0
    minDur: 4.6
    accent: green
    headline: null
    lines:
      - id: x_cta
        beat: cta
        caption: ERD Studio is free to use. Install it today.
