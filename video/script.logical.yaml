# Getting-started video, the LOGICAL cut (VARIANT=logical): the default cut's story for a folder
# without dbt. The Welcome panel plays it where there is no dbt_project.yml (its 'logical' and
# 'nofolder' pages). It is the same recording of the real VS Code, in its light theme: where a model
# lives today (every source the import reads, one wall of logos), getting its DDL out in one step
# (pg_dump, for real; Snowflake's GET_DDL beside it), bringing that in (Import SQL DDL…, its draft,
# Keep as Diagram), the DBML files that saves next to the code, a 2,000-table diagram, an edit by
# hand, the same kind of edit by Claude Code (Set Up My AI Helper's skill, its pre-tool hook, the
# diagram updating), what it changed (held: the lines it wrote, the new table on the canvas), that
# change and the code that builds it in one pull request, and ERD Studio for Confluence showing the
# diagram from the repo. script.yaml is the same tour with one more beat, about what a dbt project
# adds, before Confluence.
#
# Format: exactly as script.yaml (see its header), with one addition: `recording.footage` names the
# cut whose takes this one plays. The plain take script.yaml's footage was filmed in (record/,
# record/takes.json) is a folder without dbt_project.yml (and the scale take a project without
# one), so this cut films nothing of its own: record/composite.mjs lays those takes' footage on this
# cut's clock, and refuses it unless each recorded scene here has the default cut's length and beats
# (the clicks were timed to them). So every recorded scene below is script.yaml's, word for word.
# Only `bring` (HTML: the wall of sources) differs: its first line and its wall name no dbt. Change
# a recorded scene here and in script.yaml together, then record the default cut again (`npm test`
# checks the two match).
#
# Words to keep OUT of this file and everything this cut shows (narration, captions, headlines,
# chapter labels, props, the recorded screen and terminal): dbt, Physical, Diff, manifest, sample project.
# `npm test` checks the file, the modules it renders, its frames and the take's on-screen text.
# "DBML", "Git", "repo", "AI" and "table" are fine. Never "No AI needed": the tour shows both ways,
# by hand and with an AI assistant.
#
# Length: 80–200 s (maxDuration 200). The walkthrough's watchLogical step and the Help & Feedback
# view call it "Watch the Tour", with no length in the name.

title: ERD Studio — getting started, logical cut
maxDuration: 200

# The recorded window's place in the 1920x1080 frame (frame px). The isolated VS Code window is
# 1440x600 CSS px (record/vscode.mjs WINDOW) rendered at 2x (DPR), filmed scaled down to fill this rect exactly.
recording:
  inset: { x: 96, y: 240, w: 1728, h: 720 }
  # the default cut's takes (build/rec/, record/takes.json): this cut is never recorded on its own
  footage: default
  # the default cut's punch-in on the terminal, while pg_dump is typed (its other one is not in this cut)
  zoom:
    - { scene: export, beat: pg, offset: 0.5, dur: 0.4, scale: 1.6, focus: [1230, 150], until: [pg, 3.9] }

voice:
  engine: kokoro        # kokoro | say
  kokoro: af_heart      # Kokoro v1.0 voice id (Apache-2.0)
  speed: 1.04
  say: Karen            # macOS fallback voice (en-AU)
  sayRate: 175

timing:
  lead: 0.35
  gap: 0.2
  tail: 0.45
  fade: 0.25

chapters: ["1 · IMPORT", "2 · SAVE", "3 · SCALE", "4 · EDIT", "5 · SHARE"]

scenes:
  - id: hook
    module: rec/window
    chapter: 0
    minDur: 6
    accent: blue
    headline: ["Your data model,", "in {your repo}."]
    # the finished diagram beside its files; the claims sit right of the headline (beat, seconds after it)
    props:
      claims: [['DBML files in Git', model, 2.6], ['By hand or with AI', ai, 0.6]]
    lines:
      - id: h_model
        beat: model
        caption: Your data model as a diagram, saved as DBML files in your repo.
      - id: h_ai
        beat: ai
        caption: Edit it by hand, or with your AI assistant, through a built-in skill it uses by itself.

  - id: bring
    module: sources/wall
    chapter: 1
    minDur: 10.2   # about a second after the line, then on
    accent: blue
    headline: ["Already have a model?", "{Bring it in}."]
    # every source this cut's audience brings a model in from (script.yaml's wall without its first
    # tile), landing as the line plays, then still (player/scenes/sources/wall.js SOURCES)
    props:
      sources: [databricks, snowflake, powerBi, fabric, postgresql, sqlServer, mysql, oracle, bigquery, redshift, mariadb, sqlite, dbml]
    lines:
      - id: b_have
        beat: have
        caption: "Already have a model? Bring it in from the tools most teams use: Databricks, Snowflake, Power BI and the most popular SQL databases."

  - id: export
    module: rec/window
    chapter: 1
    minDur: 9
    accent: blue
    headline: ["Getting the DDL out?", "{One step}."]
    # pg_dump in the terminal, for real (record/fixtures.mjs: a local PostgreSQL database, the whole
    # database in one file); Snowflake's one query is a card right of the headline (props.query), not filmed
    props:
      query: { beat: sf, offset: 0.3, logo: snowflake, name: Snowflake, sql: "SELECT GET_DDL('SCHEMA', 'SHOP.SALES');", note: saved as a .sql file }
    lines:
      - id: x_one
        beat: one
        caption: Getting the DDL out is one step, for a whole schema or database.
      - id: x_pg
        beat: pg
        caption: From PostgreSQL, pg_dump writes it to a file.
        say: From Postgress Q L, P G dump writes it to a file.
      - id: x_sf
        beat: sf
        pause: 0.149   # the take was filmed for this scene's length: Postgress Q L is a little longer than the voice's first reading
        caption: From Snowflake, it's one query, GET_DDL, saved as a .sql file.
        say: From Snowflake, it's one query, get D D L, saved as a dot S Q L file.

  - id: importSql
    module: rec/window
    chapter: 1
    minDur: 8
    accent: blue
    headline: ["Import the {DDL}.", "Nine SQL dialects."]
    lines:
      - id: s_import
        beat: import
        caption: Then click New, Import SQL DDL, and import the folder.
      - id: s_dialect
        beat: dialect
        pause: 0.149   # as x_sf: the scene keeps the length its take was filmed for
        caption: "It works out the dialect: PostgreSQL, one of the nine it reads."
        say: "It works out the dialect: Postgress Q L, one of the nine it reads."

  - id: draft
    module: rec/window
    chapter: 1
    minDur: 6
    accent: blue
    headline: ["Nothing is saved", "until {you keep it}."]
    lines:
      - id: d_draft
        beat: draft
        caption: You get a draft of every table and relationship.
      - id: d_keep
        beat: keep
        pause: 0.9
        caption: Keep it, and it's your diagram.

  - id: files
    module: rec/window
    chapter: 2
    minDur: 6
    accent: blue
    headline: ["Saved as {DBML},", "next to your code."]
    lines:
      - id: f_files
        beat: files
        caption: Each table is now a DBML file, an open format, next to the code that builds it.
      - id: f_review
        beat: review
        caption: Change it, and Git shows exactly what changed.

  - id: scale
    module: rec/window
    chapter: 3
    minDur: 17.2   # the hovered table's arrows flow for about 2.5 s, then the pointer moves on to a dimension
    accent: blue
    headline: ["Big models?", "{2,000 tables}."]
    # its own take, in a 2,000-table project (record/bigProject.mjs): opened from the side bar, its
    # lines settling as the routing worker finishes (timed on the take, kept in record/takes.json
    # scale.notes.routing, but never claimed: the time depends on the machine), fitted, a zoom into
    # one area, a table hovered. The figures sit right of the headline.
    props:
      stats: [['2,000 tables', big, 1.4], ['2,700 relationships', big, 2.2], ['Lines routed in the background', route, 0.6]]
    lines:
      - id: z_big
        beat: big
        caption: "Big models stay readable: this one has 2,000 tables and 2,700 relationships."
      - id: z_route
        beat: route
        caption: Every line finds its way around the tables in the background, in seconds.
      - id: z_hover
        beat: hover
        caption: "Zoom in, and hover a table: arrows flow along its relationships."

  - id: byHand
    module: rec/window
    chapter: 4
    minDur: 7
    accent: blue
    headline: ["Edit it {by hand},", "on the canvas."]
    lines:
      - id: e_hand
        beat: hand
        caption: Edit it by hand, on the canvas. Add a table, with starter columns if you like, and lay it out.
      - id: e_save
        beat: save
        caption: Every edit is saved to its file.

  - id: aiSetup
    module: rec/window
    chapter: 4
    minDur: 7
    accent: blue
    headline: ["Or ask your", "{AI assistant}."]
    # the assistants Set Up My AI Helper sets up (src/types/aiAssistants.ts AI_ASSISTANTS, its names),
    # each lit after "teach your assistant" (beat, seconds after it). Shown, not said: the narration
    # stays on Claude Code, and nothing claims the pre-tool hook for the others.
    props:
      assistants: [skill, 2.4, ['Claude Code', 'GitHub Copilot', 'Codex', 'Gemini CLI', 'Cursor']]
    lines:
      - id: a_or
        beat: or
        caption: Or ask your AI assistant. Click Set Up My AI Helper.
      - id: a_skill
        beat: skill
        caption: "It adds a skill: plain markdown files that teach your assistant ERD Studio's format."

  - id: aiRun
    module: rec/window
    chapter: 4
    minDur: 15.5   # the new table holds on screen, in the open, for about 2 s after its line
    accent: blue
    headline: ["Ask for a change.", "{Watch it appear}."]
    # The wait for Claude Code is sped up (record/scenes.mjs marks it; composite.mjs shows a "sped up"
    # badge over the footage while it is): `fastForward.until` is where, in this scene's time, the
    # footage is back to real time.
    props:
      fastForward: { until: [live, 0.8] }
    lines:
      - id: r_ask
        beat: ask
        caption: Ask Claude Code for a change, in plain words.
      - id: r_hook
        beat: hook
        pause: 0.5
        caption: It loads the ERD Studio skill by itself, and a pre-tool hook makes sure it has, before any edit,
      - id: r_live
        beat: live
        caption: so what it writes is a diagram you can see, right away.

  - id: aiShow
    module: tour/aiChange
    chapter: 4
    minDur: 9.6    # the change held: what it wrote, then the canvas punched in on the new table, about 1.9 s in silence after its last line
    accent: blue
    headline: ["See what it {changed}:", "in the {files}, on the {canvas}."]
    # a still of aiRun's last frame where the footage was (composite.mjs cuts to it with no fade;
    # player/assets/still-aiRun.jpg, `npm run still`), then the lines Claude Code wrote (its own
    # edits, word for word: record/takes.json) and the new table and its relationship, punched in
    props:
      still: aiRun
    lines:
      - id: w_files
        beat: files
        caption: "Here's the change: a new table file, and the line that links it to the orders table."
      - id: w_canvas
        beat: canvas
        caption: On the canvas, the new table and its relationship.

  - id: pr
    module: tour/pullRequest
    chapter: 4
    minDur: 8.6    # the review held after its last line
    accent: blue
    headline: ["One pull request:", "the {design} and the {code}."]
    # a code review's Files changed: the .dbml lines Claude Code wrote beside the SQL that builds the
    # table (pipelines/, the project's own code folder), one pull request
    lines:
      - id: p_one
        beat: one
        caption: The design change goes in the same pull request as the code that builds it,
      - id: p_review
        beat: review
        caption: so your team reviews both together.

  - id: confluence
    module: tour/confluence
    chapter: 5
    minDur: 13.3   # about 1.3 s after its last line: the page and its pills hold before the end card
    accent: blue
    headline: ["One source of truth:", "{your repo}."]
    lines:
      - id: c_truth
        beat: truth
        caption: "Your repo is the single source of truth: just DBML files, no modelling database."
      - id: c_confluence
        beat: confluence
        caption: ERD Studio for Confluence reads them from GitHub, and shows the diagram to business users.

  - id: end
    module: tour/endCard
    chapter: 0
    minDur: 5.2    # a silent hold of about 2.4 s on the end card after its line
    accent: green
    headline: null
    lines:
      - id: x_cta
        beat: cta
        caption: ERD Studio is free to use in VS Code.
