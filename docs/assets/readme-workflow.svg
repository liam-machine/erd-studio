<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" fill="none">
  <title>Plain files render as your canvas. With dbt, a second view is derived.</title>
  <desc>Top: a model YAML file and a diagram JSON file in your repository render together as the ERD Studio logical canvas, where dim_customer and fct_order are joined one to many, and canvas edits save back to the same files. Bottom, inside a dashed box marked optional and only if you use dbt: your dbt project — schema YAMLs always, manifest.json after a dbt run, catalog.json after dbt docs generate — derives a physical view of the same diagram, showing the real columns and data types, with edges and cardinality taken from your dbt tests, rebuilt on every change and never written to disk. The two views can be compared.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1120" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343239"/>
      <stop offset="1" stop-color="#18191E"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3A393F"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#E6CC7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#5FD68B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1120" height="710" rx="20" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1119" height="709" rx="19.5" stroke="#4A4850"/>
  <g font-family="Arial, Helvetica, sans-serif">

    <text x="32" y="43" fill="#A8B4C3" font-size="14" font-weight="700" letter-spacing="2">FILES IN YOUR REPO</text>
    <text x="540" y="43" fill="#A8B4C3" font-size="14" font-weight="700" letter-spacing="2">YOUR LOGICAL CANVAS</text>

    <rect x="32" y="68" width="356" height="108" rx="12" fill="#2D2C32" stroke="#78604C"/>
    <rect x="48" y="84" width="62" height="27" rx="6" fill="#493C33"/>
    <text x="79" y="103" fill="#F0C7A2" font-size="13" font-weight="700" text-anchor="middle">YAML</text>
    <text x="124" y="104" fill="#F3F5F8" font-size="20" font-weight="700">One file per model</text>
    <text x="50" y="136" fill="#C3C8D0" font-size="16">Columns, keys and design decisions</text>
    <text x="50" y="159" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">dim_customer.yml</text>

    <rect x="32" y="186" width="356" height="108" rx="12" fill="#2D2C32" stroke="#626A76"/>
    <rect x="48" y="202" width="62" height="27" rx="6" fill="#3A4049"/>
    <text x="79" y="221" fill="#D7E0E9" font-size="13" font-weight="700" text-anchor="middle">JSON</text>
    <text x="124" y="222" fill="#F3F5F8" font-size="20" font-weight="700">One file per diagram</text>
    <text x="50" y="254" fill="#C3C8D0" font-size="16">Model names, relationships and layout</text>
    <text x="50" y="277" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">orders.json</text>

