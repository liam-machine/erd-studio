<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="396" viewBox="0 0 1120 396" fill="none">
  <title>Plain files. One editable canvas.</title>
  <desc>Model YAML and diagram JSON files in your repository render together as the ERD Studio logical canvas. Canvas edits are saved to the same files.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1120" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343239"/>
      <stop offset="1" stop-color="#18191E"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3A393F"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#E6CC7E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1120" height="396" rx="20" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1119" height="395" rx="19.5" stroke="#4A4850"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="43" fill="#A8B4C3" font-size="14" font-weight="700" letter-spacing="2">FILES IN YOUR REPO</text>
    <text x="540" y="43" fill="#A8B4C3" font-size="14" font-weight="700" letter-spacing="2">YOUR LOGICAL CANVAS</text>

    <rect x="32" y="68" width="356" height="112" rx="12" fill="#2D2C32" stroke="#78604C"/>
    <rect x="48" y="84" width="62" height="27" rx="6" fill="#493C33"/>
    <text x="79" y="103" fill="#F0C7A2" font-size="13" font-weight="700" text-anchor="middle">YAML</text>
    <text x="124" y="104" fill="#F3F5F8" font-size="20" font-weight="700">One file per model</text>
    <text x="50" y="139" fill="#C3C8D0" font-size="16">Columns, keys and design decisions</text>
    <text x="50" y="162" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">dim_customer.yml</text>

    <rect x="32" y="200" width="356" height="112" rx="12" fill="#2D2C32" stroke="#626A76"/>
    <rect x="48" y="216" width="62" height="27" rx="6" fill="#3A4049"/>
    <text x="79" y="235" fill="#D7E0E9" font-size="13" font-weight="700" text-anchor="middle">JSON</text>
    <text x="124" y="236" fill="#F3F5F8" font-size="20" font-weight="700">One file per diagram</text>
    <text x="50" y="271" fill="#C3C8D0" font-size="16">Model names, relationships and layout</text>
    <text x="50" y="294" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">orders.json</text>

    <path d="M398 124H432Q448 124 448 140V174Q448 190 464 190H523" stroke="#E6CC7E" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M398 256H432Q448 256 448 240V206Q448 190 464 190" stroke="#E6CC7E" stroke-width="2"/>
    <text x="478" y="172" fill="#C3C8D0" font-size="13" text-anchor="middle">render</text>

    <rect x="540" y="68" width="548" height="244" rx="12" fill="#212126" stroke="#48474F"/>
    <rect x="541" y="112" width="546" height="187" fill="url(#grid)"/>
    <path d="M540 112H1088" stroke="#48474F"/>
    <circle cx="559" cy="90" r="4" fill="#E6CC7E"/>
    <text x="574" y="96" fill="#F3F5F8" font-size="16" font-weight="700">Orders</text>
    <rect x="991" y="79" width="80" height="24" rx="12" fill="#443D29"/>
    <text x="1031" y="96" fill="#F5E6AE" font-size="12" font-weight="700" text-anchor="middle">LOGICAL</text>

    <rect x="559" y="136" width="211" height="134" rx="8" fill="#303036" stroke="#877445"/>
    <path d="M560 176H769" stroke="#48474F"/>
    <text x="573" y="162" fill="#F3F5F8" font-size="17" font-weight="700">dim_customer</text>
    <text x="573" y="201" fill="#E6CC7E" font-size="12" font-weight="700">PK</text>
    <text x="602" y="201" fill="#D7E0E9" font-size="15">customer_id</text>
    <text x="602" y="226" fill="#A8B4C3" font-size="15">name</text>
    <text x="602" y="251" fill="#A8B4C3" font-size="15">email</text>

    <rect x="850" y="166" width="219" height="118" rx="8" fill="#303036" stroke="#877445"/>
    <path d="M851 206H1068" stroke="#48474F"/>
    <text x="864" y="192" fill="#F3F5F8" font-size="17" font-weight="700">fct_order</text>
    <text x="864" y="232" fill="#E6CC7E" font-size="12" font-weight="700">PK</text>
    <text x="893" y="232" fill="#D7E0E9" font-size="15">order_id</text>
    <text x="864" y="258" fill="#E6CC7E" font-size="12" font-weight="700">FK</text>
    <text x="893" y="258" fill="#D7E0E9" font-size="15">customer_id</text>
    <path d="M770 196H798Q810 196 810 208V242Q810 254 822 254H850" stroke="#E6CC7E" stroke-width="2"/>
    <path d="M779 190V202M848 246L836 254L848 262" stroke="#E6CC7E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M818 328V343Q818 354 807 354H221Q210 354 210 343V329" stroke="#807B72" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M206 334L210 329L214 334" stroke="#807B72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="363" y="339" width="310" height="29" rx="10" fill="#25252B"/>
    <text x="518" y="359" fill="#C3C8D0" font-size="15" text-anchor="middle">Canvas edits save to the same files</text>
  </g>
</svg>
