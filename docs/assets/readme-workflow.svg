    <text x="114" y="492" fill="#F3F5F8" font-size="20" font-weight="700">Your dbt project</text>
    <text x="50" y="524" fill="#C3C8D0" font-size="16">Columns, tests and warehouse types</text>
    <text x="50" y="549" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">models/schema.yml</text>
    <text x="372" y="549" fill="#7F8C9D" font-size="11" text-anchor="end">always</text>
    <text x="50" y="572" fill="#99A7B8" font-size="14" font-family="Menlo, Consolas, monospace">target/manifest.json</text>
