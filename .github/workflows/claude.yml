name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          label_trigger: ""
          prompt: |
            Review this PR. Follow the project review guidelines in CLAUDE.md.

            ## What to check

            **Architecture rules:**
            - All domain file mutations must go through WorkspaceEdit for undo/redo integration — never write directly via fs (exception: generated output files like .sync-plan.json)
            - Physical stage is read-only and derived at runtime — reject any code that persists physical data to disk or allows mutation messages in physical stage
            - Relationships in physical stage come entirely from manifest relationship tests, not from logical stage
            - Schema changes (fields in src/types/semantic.ts, file layout, naming conventions) must update SCHEMA_CONTENT in src/services/harnessService.ts and bump HARNESS_VERSION
            - Message protocol changes must update the discriminated unions in src/types/messages.ts for both directions
            - React Flow custom node/edge types must be defined as module-level constants, not inside component render functions

            **Legacy identifiers — do NOT rename:**
            Command IDs (dbtSemantic.*), View IDs (dbt-semantic, dbtSemantic.domainTree), custom editor viewType (dbtSemantic.domainEditor), setting keys (dbtSemantic.projectPath, dbtSemantic.semanticDir), colour IDs (dbtSemantic.layer.*), command category ("category": "dbt")

            **Style:**
            - All colours must use CSS custom properties from webview/styles/theme.css — no hardcoded hex/rgb values
            - BEM CSS class naming (block__element--modifier)
            - Stage colours: logical is blue (#60a5fa), physical is green (#22c55e)

            **Skip:**
            - Formatting-only changes in lock files
            - Changes to test/fixtures/ sample data files
            - Auto-generated version bump commits

            When a contributor comments "@claude fix these bugs" or "@claude fix this", apply the fixes directly via a commit to the PR branch.
          claude_args: '--max-turns 25 --allowedTools "Bash(gh pr:*)" "Bash(gh api:*)" "Bash(cat:*)" "Bash(head:*)"'
          show_full_output: true
