name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request by performing three analysis passes, then post exactly ONE review.

            ## Analysis passes

            **Pass 1 — Change Summary**: List files changed in a markdown table with columns: File, Change. Keep change descriptions concise (under 12 words). Group files by layer using row headers like `**Webview**`, `**Extension Host**`, `**Tests**`, `**Docs**`, `**Build/CI**`. Note if the message protocol (src/types/messages.ts) is affected.

            **Pass 2 — Bug & Logic Detection**: Check for WorkspaceEdit bypasses, physical stage mutations (must be read-only), inline React Flow type registrations, missing message types in discriminated unions, ELK worker issues, Zustand anti-patterns, null/undefined mishandling, race conditions.

            **Pass 3 — Security & Quality**: Check for hardcoded secrets, schema changes without HARNESS_VERSION bump, hardcoded CSS colours (should use theme.css vars), BEM violations, renamed dbtSemantic legacy prefixes (must NOT be renamed).

            ## Posting the review

            After analysis, write the review body to /tmp/review.md, then post it with ONE `gh pr review` command. Do NOT run `gh pr review` more than once.

            The review body MUST start with a TLDR section in exactly this format:

            If approving:
            ```
            ## TLDR
            :white_check_mark: **APPROVED** — no bugs, security issues, or architectural violations found.
            ```

            If requesting changes:
            ```
            ## TLDR
            :x: **CHANGES REQUESTED** — found <N> issue(s) that should be fixed before merging.
            - <one-line description of each issue>
            ```

            After the TLDR, include the full three-pass analysis with a table of changes, findings, and any style suggestions.

            To post, write the body to a file first, then use:
            ```
            gh pr review <number> --approve --body-file /tmp/review.md
            ```
            or:
            ```
            gh pr review <number> --request-changes --body-file /tmp/review.md
            ```

            IMPORTANT: Only call `gh pr review` exactly ONCE. Do not retry or repost.

            When a contributor comments "@claude fix these bugs" or "@claude fix this", apply the fixes directly via a commit to the PR branch.
          claude_args: '--max-turns 50 --allowedTools "Bash(gh pr:*)" "Bash(gh api:*)"'
