name: Deploy to VS Code Marketplace and Open VSX

# One workflow per merge to main, three jobs in order:
#   changes          → what this merge releases (the two flags below)
#   telemetry-worker → D1 migrations, then the telemetry Worker (telemetry/)
#   deploy           → the extension, only after the Worker succeeded or had
#                      nothing to deploy; a failed Worker blocks the release,
#                      because an older Worker drops keys a new extension sends.
on:
  pull_request:
    types: [closed]
    branches: [main]
    # Docs-only / fixture-only / planning-only / CI-only PRs do not produce a
    # release (nothing under .github/ ships in the VSIX).
    # Every marketplace release triggers a save-all + window reload for users
    # with a canvas open, so avoid publishing when nothing shipped changes.
    # telemetry/** is deliberately NOT here: a telemetry-only merge must start
    # this workflow so the Worker deploys. The `changes` job below repeats this
    # list (plus telemetry/**) as the "not the extension" filter;
    # test/unit/deployWorkflow.test.ts fails when the two drift.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'test/fixtures/**'
      - '.planning/**'
      - '.github/**'
      - 'social-video/**'
      - '.claude/**'
      # npm package release tooling (publish-packages.yml); nothing in the VSIX.
      - 'scripts/release-packages.mjs'
      - 'test/unit/releasePackages.test.ts'
      # Checks this workflow's own lists; nothing in the VSIX.
      - 'test/unit/deployWorkflow.test.ts'
      # A sibling project, never in the VSIX. A change to the src/services it
      # imports still triggers a release through src/.
      - 'mcp-server/**'
      # The feedback-analysis proxy (Cloudflare Worker), deployed by hand from
      # proxy/README.md; never in the VSIX.
      - 'proxy/**'

concurrency:
  group: deploy-main
  cancel-in-progress: false

# Each job asks for what it needs.
permissions: {}

jobs:
  # Two independent questions:
  #   extension — did this PR change anything that ships in the VSIX?
  #   worker    — does main's telemetry/ differ from the commit the Worker was
  #               last deployed from (the telemetry-worker-deployed tag)? Asked
  #               of main, not of this PR: GitHub cancels a run still pending in
  #               the deploy-main group when a newer merge queues behind it, and
  #               a deploy can fail. Either way the next run deploys the Worker
  #               before it releases the extension, instead of the change being
  #               lost. A manual deploy does not move the tag, so the next run
  #               redeploys the same code, which is harmless.
  changes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    outputs:
      extension: ${{ steps.filter.outputs.extension }}
      worker: ${{ steps.worker.outputs.changed }}
      sha: ${{ steps.worker.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the tag and its history
          filter: blob:none

      # A file counts for the extension unless it matches a pattern below:
      # `every` makes each pattern, negations included, have to match.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            extension:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!test/fixtures/**'
              - '!.planning/**'
              - '!.github/**'
              - '!social-video/**'
              - '!.claude/**'
              - '!scripts/release-packages.mjs'
              - '!test/unit/releasePackages.test.ts'
              - '!test/unit/deployWorkflow.test.ts'
              - '!mcp-server/**'
              - '!proxy/**'
              - '!telemetry/**'

      - name: Has the telemetry Worker changed since its last deploy?
        id: worker
        env:
          TAG: telemetry-worker-deployed
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if ! git rev-parse --quiet --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            echo "No ${TAG} tag yet; deploying the Worker"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only --no-renames "refs/tags/${TAG}" "$SHA" -- telemetry ':(exclude,glob)telemetry/**/*.md')
          if [ -n "$CHANGED" ]; then
            echo "Changed since the last Worker deploy:"; echo "$CHANGED"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "telemetry/ unchanged since $(git rev-parse --short "refs/tags/${TAG}")"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  telemetry-worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    # deploy-main already serialises whole runs; this also keeps any future
    # caller of this job from overlapping a deploy.
    concurrency:
      group: telemetry-worker
      cancel-in-progress: false
    permissions:
      contents: write # move the telemetry-worker-deployed tag
    env:
      SHA: ${{ needs.changes.outputs.sha }}
      TAG: telemetry-worker-deployed
    steps:
      # Fail loudly: a skipped Worker deploy would silently drop the data a new
      # extension release sends.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret ${name} is not set. The telemetry Worker cannot deploy, so the extension release is blocked. See telemetry/README.md → Deploy."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        working-directory: telemetry
        run: npm test && npm run check

      # Tracked: wrangler records each file in d1_migrations and applies it once,
      # BEFORE the Worker that writes its columns goes live.
      - name: Apply D1 migrations
        id: migrate
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: telemetry
          command: d1 migrations apply erd-studio-telemetry --remote

      - name: Explain a failed migration
        if: failure() && steps.migrate.outcome == 'failure'
        run: |
          echo "::error::D1 migrations failed, so neither the Worker nor the extension was released. 'duplicate column name' means the database has a migration applied by hand that d1_migrations does not record: run the one-time baseline in telemetry/README.md, then re-run this workflow."

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          workingDirectory: telemetry
          command: deploy --message "deploy.yml from ${{ needs.changes.outputs.sha }}"

      # Bookkeeping only: the Worker is live, so a failed push must not block the
      # extension. Without it the next run redeploys the same Worker (harmless).
      - name: Record the deployed commit
        continue-on-error: true
        run: |
          if ! git push --force origin "${SHA}:refs/tags/${TAG}"; then
            echo "::warning::Could not move the ${TAG} tag; the next merge will redeploy the Worker."
            exit 1
          fi

  deploy:
    needs: [changes, telemetry-worker]
    # After the Worker, or when it had nothing to deploy (skipped) — never after
    # it failed or was cancelled. `!cancelled()` is what lets a job run when one
    # of its needs was skipped.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.extension == 'true'
      && (needs.telemetry-worker.result == 'success' || needs.telemetry-worker.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run compile

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Check Claude approval
        id: claude_check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          CLAUDE_APPROVED=$(gh api "/repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.user.login == "claude[bot]" and .state == "APPROVED")] | length')

          if [ "$CLAUDE_APPROVED" -gt 0 ]; then
            echo "Claude approved PR #${PR_NUMBER}"
            echo "approved=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PR #${PR_NUMBER} was merged WITHOUT Claude approval. Deploying anyway (soft enforcement)."
            echo "approved=no" >> "$GITHUB_OUTPUT"
          fi

      # The next version is max(package.json, latest marketplace version) + patch,
      # so a desynced repo (lost bump commit, rewritten history) can never fail
      # with "version already exists".
      - name: Determine next version
        run: |
          # A rerun after the bump was pushed must retry that exact release. A
          # blind patch bump would skip a version every time Marketplace timed
          # out after this workflow had already advanced main.
          HEAD_SUBJECT=$(git log -1 --format=%s)
          HEAD_PARENT=$(git rev-parse HEAD^)
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          if [[ "$HEAD_SUBJECT" == "chore: bump version to v"*" [deploy]" && "$HEAD_PARENT" == "$MERGE_SHA" ]]; then
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "RECOVER_EXISTING_RELEASE=true" >> "$GITHUB_ENV"
            echo "Recovering interrupted release v${NEW_VERSION}"
            echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
            exit 0
          fi

          # Write scratch files under RUNNER_TEMP, never the working tree: this
          # step runs before `vsce package`, so anything left in the repo root
          # ships to users (v0.6.47 went out carrying marketplace.json).
          SHOW_JSON="${RUNNER_TEMP}/marketplace.json"
          SHOW_ERR="${RUNNER_TEMP}/vsce-show.err"
          if ! npx @vscode/vsce show liamwynne.erd-studio --json > "$SHOW_JSON" 2> "$SHOW_ERR"; then
            echo "::warning::vsce show failed; falling back to package.json version"
            cat "$SHOW_ERR"
            echo '{}' > "$SHOW_JSON"
          fi
          NEW_VERSION=$(node scripts/release.mjs next-version --marketplace-json "$SHOW_JSON")
          npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
          echo "NEW_VERSION=${NEW_VERSION}" >> "$GITHUB_ENV"
          echo "Releasing v${NEW_VERSION}"

      - name: Update CHANGELOG
        if: env.RECOVER_EXISTING_RELEASE != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release.mjs changelog --version "$NEW_VERSION"

      # Commit and push the bump BEFORE publishing so a failed publish never
      # leaves main behind the marketplace.
      - name: Commit version bump
        if: env.RECOVER_EXISTING_RELEASE != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to v${NEW_VERSION} [deploy]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt ${attempt}); rebasing onto origin/main and retrying"
            git pull --rebase origin main
          done
          echo "::error::Could not push version bump after 3 attempts"
          exit 1

      # `vsce package` runs the vscode:prepublish hook (npm run package), so no
      # separate production build step is needed. esbuild bundles every runtime
      # dependency into dist/, so vsce's npm dependency walk is skipped.
      - name: Publish to VS Code Marketplace
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
        run: |
          npx @vscode/vsce package --no-dependencies -o erd-studio.vsix
          # CI's file-list gate only sees the PR checkout; this job creates
          # files of its own, so assert the real published contents here too.
          npx @vscode/vsce ls --no-dependencies > vsce-files.txt
          COUNT=$(wc -l < vsce-files.txt | tr -d ' ')
          echo "Publishing ${COUNT} files:"; cat vsce-files.txt
          if [ "$COUNT" -gt 60 ]; then
            echo "::error::vsce would publish ${COUNT} files (limit 60) — check .vscodeignore and this job's scratch files"
            exit 1
          fi
          for attempt in 1 2 3; do
            LOG_FILE="${RUNNER_TEMP}/vsce-publish-${attempt}.log"
            if npx @vscode/vsce publish --packagePath erd-studio.vsix --pat "$AZURE_PAT" --skip-duplicate 2>&1 | tee "$LOG_FILE"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Publish attempt ${attempt} failed; retrying in $((attempt * 15)) seconds"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Marketplace publish failed after 3 attempts"
          exit 1

      # Open VSX serves VS Code forks (VSCodium, Cursor, Windsurf, Gitpod…) that
      # cannot use the Microsoft Marketplace. It ships the exact VSIX published
      # above, so there is no second build. The Marketplace is the primary
      # registry: an Open VSX outage must not fail the release or block the
      # GitHub Release below, hence continue-on-error. --skip-duplicate makes a
      # rerun of an interrupted release a no-op here too.
      - name: Publish to Open VSX
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not set; skipping Open VSX"
            exit 0
          fi
          for attempt in 1 2 3; do
            if npx --yes ovsx@1 publish --packagePath erd-studio.vsix --pat "$OVSX_PAT" --skip-duplicate; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Open VSX attempt ${attempt} failed; retrying in $((attempt * 15)) seconds"
              sleep $((attempt * 15))
            fi
          done
          echo "::warning::Open VSX publish failed after 3 attempts; the Marketplace release is unaffected"
          exit 1

      # Only after a successful publish: a GitHub Release must never advertise a
      # version the marketplace does not have. `gh release create` also creates the
      # tag, pointing at the bump commit this job just pushed.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          node scripts/release.mjs notes --version "$NEW_VERSION" > "$NOTES_FILE"
          {
            echo
            echo '---'
            echo
            echo "Install from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=liamwynne.erd-studio), [Open VSX](https://open-vsx.org/extension/liamwynne/erd-studio) (VSCodium, Cursor, Windsurf), or from the \`.vsix\` below with **Extensions: Install from VSIX…**."
          } >> "$NOTES_FILE"

          ASSET="${RUNNER_TEMP}/erd-studio-${NEW_VERSION}.vsix"
          cp erd-studio.vsix "$ASSET"

          if gh release view "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${NEW_VERSION} already exists; refreshing its VSIX"
            gh release upload "v${NEW_VERSION}" "$ASSET" --clobber
          else
            gh release create "v${NEW_VERSION}" "$ASSET" \
              --title "v${NEW_VERSION}" \
              --notes-file "$NOTES_FILE" \
              --target "$(git rev-parse HEAD)"
          fi
