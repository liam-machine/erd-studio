name: CI

on:
  pull_request:
    branches: [main, develop]
  # Also run after every merge into develop: GitHub checks a PR against the
  # base it was opened on, so two PRs that each passed can still break develop
  # together. main needs no push trigger — deploy.yml builds and tests it.
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # Fail on high/critical advisories in shipped (non-dev) dependencies.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run compile
      - run: npm run build
      # Smoke-test the bundled erd-studio CLI (dist/cli.js) against the fixture project:
      # doctor must succeed, and diff may report drift (exit 1) but never a usage,
      # environment or internal error (2–4).
      - name: CLI smoke test
        run: |
          node dist/cli.js doctor --project test/fixtures/dbt-project --json --no-dbt > /dev/null
          rc=0; node dist/cli.js diff --project test/fixtures/dbt-project --all --json > /dev/null || rc=$?; test "$rc" -le 1
      # The extension builds the workspace packages from source; this checks
      # their own publishable builds (esbuild + declarations) still succeed.
      - run: npm run build:packages
      # What publish-packages.yml would upload: fails here, not after a merge,
      # when a package's `files` or `prepack` stops producing a tarball.
      - run: npm pack --dry-run -w @erd-studio/core -w @erd-studio/renderer
      - run: npm run test
      - run: npm run package

      # Guard against .vscodeignore regressions: the marketplace package should
      # only contain package.json, README/CHANGELOG/LICENSE, media icons and
      # dist/*. Sibling projects (mcp-server, proxy), planning docs and
      # node_modules must never be swept in. esbuild bundles every runtime
      # dependency into dist/, so vsce's npm dependency walk is skipped.
      - name: Check packaged file list stays lean
        run: |
          npx @vscode/vsce ls --no-dependencies > vsce-files.txt
          COUNT=$(wc -l < vsce-files.txt | tr -d ' ')
          echo "vsce would package ${COUNT} files:"
          cat vsce-files.txt
          if [ "$COUNT" -gt 60 ]; then
            echo "::error::vsce ls lists ${COUNT} files (limit 60) — check .vscodeignore"
            exit 1
          fi

  # mcp-server relative-imports ../src/services/* and bundles ../src/workers/manifestWorker.ts,
  # so it needs the root install as well as its own: the shared services under ../src are in
  # this project's tsconfig `include`, and some of them import `vscode` and `yaml`, which
  # resolve from the repo-root node_modules (@types/vscode, yaml). Without the root install
  # the type-check step fails on unresolved modules. An accidental `import 'vscode'` in a
  # shared service still fails the esbuild step here, because `vscode` is not in the bundle's
  # `external` list.
  # Preview of what publish-packages.yml will release to npm once this reaches
  # main, in the run summary. Informational only: it needs the npm registry,
  # and a registry hiccup must not block a PR.
  packages-plan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm release preview
        run: |
          PLAN="${RUNNER_TEMP}/package-plan.json"
          node scripts/release-packages.mjs plan --out "$PLAN"
          {
            echo '### npm packages this PR releases on merge to main'
            echo
            echo '| Package | npm | Release | Why |'
            echo '|---|---|---|---|'
            jq -r '.[] | "| `\(.name)` | \(.published // "—") | \(.next // "skipped") | \(.reason) |"' "$PLAN"
          } >> "$GITHUB_STEP_SUMMARY"

  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Install root dependencies (shared services)
        run: npm ci

      - name: Install mcp-server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: mcp-server

      - name: Build
        run: npm run build
        working-directory: mcp-server

      - name: Smoke test
        run: node test-smoke.mjs
        working-directory: mcp-server

      # Same gate as the root job. mcp-server's runtime advisories come in transitively via
      # @modelcontextprotocol/sdk (hono, ip-address, qs) and are resolvable inside the declared
      # ranges — `npm audit fix --package-lock-only` clears them with no package.json change —
      # so this can be a hard gate. Dev-only findings (esbuild) are excluded by --omit=dev.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: mcp-server

  # The telemetry Worker (telemetry/) deploys automatically from deploy.yml, so
  # its checks gate the PR. No npm install and no Cloudflare credentials: the
  # dry run bundles and validates wrangler.toml, and the migrations are applied
  # to a throwaway local D1 — the same path a brand-new database takes. Runs on
  # every PR (about a minute, beside the longer jobs) so it is never "skipped".
  telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: telemetry
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm test
      - run: npm run check

      - name: Validate the Worker config (dry run, no credentials)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "${RUNNER_TEMP}/telemetry-dry-run"

      - name: Apply the migrations to a fresh local D1
        run: npx --yes wrangler@4 d1 migrations apply erd-studio-telemetry --local --persist-to "${RUNNER_TEMP}/telemetry-d1"
