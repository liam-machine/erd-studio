name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm run build
      - run: npm run test
      - run: npm run package

      # Guard against .vscodeignore regressions: the marketplace package should
      # only contain package.json, README/CHANGELOG/LICENSE, media icons and
      # dist/*. Sibling projects (mcp-server, forge-app), planning docs and
      # node_modules must never be swept in. esbuild bundles every runtime
      # dependency into dist/, so vsce's npm dependency walk is skipped.
      - name: Check packaged file list stays lean
        run: |
          npx @vscode/vsce ls --no-dependencies > vsce-files.txt
          COUNT=$(wc -l < vsce-files.txt | tr -d ' ')
          echo "vsce would package ${COUNT} files:"
          cat vsce-files.txt
          if [ "$COUNT" -gt 60 ]; then
            echo "::error::vsce ls lists ${COUNT} files (limit 60) — check .vscodeignore"
            exit 1
          fi

  # mcp-server relative-imports ../src/services/* and bundles ../src/workers/manifestWorker.ts,
  # so it needs the root install (js-yaml, @types/vscode) plus its own. An accidental
  # `import 'vscode'` in a shared service fails the esbuild step here.
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json

      - name: Install root dependencies (shared services)
        run: npm ci

      - name: Install mcp-server dependencies
        run: npm ci
        working-directory: mcp-server

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: mcp-server

      - name: Build
        run: npm run build
        working-directory: mcp-server

      - name: Smoke test
        run: node test-smoke.mjs
        working-directory: mcp-server
