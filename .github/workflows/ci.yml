name: CI

on:
  pull_request:
    branches: [main, develop]
  # Also run after every merge into develop: GitHub checks a PR against the
  # base it was opened on, so two PRs that each passed can still break develop
  # together. main needs no push trigger — deploy.yml builds and tests it.
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Diagnose the hanging test file
        run: |
          mkdir -p /tmp/reports
          export NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/reports"
          (npx vitest run test/unit/slowFolderLooks.test.ts --reporter verbose --pool forks > /tmp/vitest.log 2>&1; echo "vitest exit $?" >> /tmp/vitest.log) &
          sleep 150
          echo "=== vitest output"; sed 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log | tail -80
          pkill -USR2 node || true
          sleep 8
          for f in /tmp/reports/*.json; do echo "=== $f"; node -e "const r=require('$f'); console.log(r.header.commandLine.join(' ').slice(0,200)); console.log(JSON.stringify(r.javascriptStack,null,1).slice(0,6000))"; done
          pkill -9 node || true
