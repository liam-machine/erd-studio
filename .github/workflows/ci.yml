name: CI

on:
  pull_request:
    branches: [main, develop]
  # Also run after every merge into develop: GitHub checks a PR against the
  # base it was opened on, so two PRs that each passed can still break develop
  # together. main needs no push trigger — deploy.yml builds and tests it.
  push:
    branches: [develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Diagnose the hanging test file
        run: |
          probe() {
            name="$1"; shift
            rm -rf /tmp/reports; mkdir -p /tmp/reports
            (NODE_OPTIONS="--report-on-signal --report-signal=SIGUSR2 --report-directory=/tmp/reports" npx vitest run test/unit/slowFolderLooks.test.ts --reporter verbose --pool forks "$@" > /tmp/vitest.log 2>&1; echo "vitest exit $?" >> /tmp/vitest.log) &
            sleep 45
            echo "=================== $name: vitest output"; sed 's/\x1b\[[0-9;]*m//g' /tmp/vitest.log | tail -12
            pkill -USR2 node || true
            sleep 6
            for f in /tmp/reports/*.json; do node -e "
              const r=require('$f'); const cmd=r.header.commandLine.join(' ');
              if(!/tinypool/.test(cmd)) process.exit(0);
              console.log('--- worker', r.header.processId, 'js:', JSON.stringify(r.javascriptStack).slice(0,1500));
              console.log('native:', (r.nativeStack||[]).slice(0,12).map(x=>x.symbol).join(' | ').slice(0,1500));
              for (const h of r.libuv) if (h.type!=='loop' || true) console.log('  uv', JSON.stringify(h).slice(0,300));
            "; done
            pkill -9 node || true; sleep 2
          }
          probe "whole file"
          probe "only the bounded-wait test" -t "still waits, bounded"
          probe "only the busy-loop test" -t "event loop was busy"
