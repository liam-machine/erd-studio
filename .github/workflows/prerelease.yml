name: Pre-release to VS Code Marketplace and Open VSX

# Publishes an opt-in PRE-RELEASE of the extension from any branch, tag or
# commit: only people who click "Switch to Pre-Release Version" get it, while
# everyone else stays on the stable release deploy.yml publishes.
#
#   gh workflow run prerelease.yml -f ref=feat/native-dbml-storage -f version=1.9.0
#
# Manual only (workflow_dispatch), and the file must be on main to be
# dispatchable. Unlike deploy.yml it never commits, pushes or bumps a version
# on any branch: the version is set only inside this run's checkout, and the
# GitHub Release tag (prerelease-v<version>) is created through the API on the
# released commit, just before the first publish. A re-run only finishes a
# release whose tag marks the commit it checked out. It never publishes the npm packages and never deploys the
# telemetry Worker. Recipe and version scheme: docs/dev/releasing.md →
# "Pre-releases (opt-in)". test/unit/prereleaseWorkflow.test.ts pins the
# safety properties.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to release (e.g. feat/native-dbml-storage)
        required: true
        type: string
      version:
        description: Pre-release version x.y.z — above the latest stable, below the ref's pinned stable version (e.g. 1.9.0 before 2.0.0)
        required: true
        type: string
      allow_undeployed_telemetry:
        description: Release even though the ref changes telemetry/ beyond the deployed Worker (new telemetry keys are dropped until it is deployed)
        required: false
        type: boolean
        default: false

# Own group, never deploy-main: GitHub cancels a run still pending in a group
# when another queues behind it, and a stable deploy must never be the one lost.
concurrency:
  group: prerelease
  cancel-in-progress: false

permissions: {}

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the pre-release GitHub Release and its tag
    env:
      VERSION: ${{ inputs.version }}
      TARGET_REF: ${{ inputs.ref }}
    steps:
      # Two checkouts. The release tooling (scripts/release.mjs) comes from the
      # commit this workflow runs from (main), because the ref being released may
      # predate the pre-release checks. The ref itself goes in ext/, so nothing
      # from tooling/ can be swept into the VSIX.
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tooling
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check out the ref to release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: ext
          fetch-depth: 0 # the telemetry-worker-deployed tag and its history
          persist-credentials: false # this workflow never pushes

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ext/package-lock.json

      # Fail fast, before anything is built. A Marketplace lookup failure fails
      # here (unlike the stable deploy, which falls back): a pre-release number is
      # never guessed. A re-run of this same run (run_attempt > 1) may find its
      # own pre-release already published and carries on (--skip-duplicate below),
      # but only when the prerelease-v<version> tag marks the commit this attempt
      # checked out: a re-run resolves a branch `ref` again, and its tip may have
      # moved since the first attempt published.
      - name: Validate the version
        working-directory: ext
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="prerelease-v${VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          # The commit the tag marks (peeling an annotated tag), or empty when
          # there is no such tag. Exported for the tagging step below.
          TAG_REF=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>/dev/null || true)
          case "$TAG_REF" in
            "tag "*) TAG_COMMIT=$(gh api "repos/${GH_REPO}/git/tags/${TAG_REF#tag }" --jq .object.sha) ;;
            "commit "*) TAG_COMMIT="${TAG_REF#commit }" ;;
            *) TAG_COMMIT="" ;;
          esac
          echo "TAG_COMMIT=${TAG_COMMIT}" >> "$GITHUB_ENV"

          # Scratch files live under RUNNER_TEMP, never the checkout: anything
          # left in ext/ ships in the VSIX.
          SHOW_JSON="${RUNNER_TEMP}/marketplace.json"
          SHOW_ERR="${RUNNER_TEMP}/vsce-show.err"
          if ! npx --yes @vscode/vsce show liamwynne.erd-studio --json > "$SHOW_JSON" 2> "$SHOW_ERR"; then
            cat "$SHOW_ERR"
            echo '{}' > "$SHOW_JSON"
          fi
          RERUN=()
          if [ "$RUN_ATTEMPT" != "1" ]; then
            RERUN=(--rerun)
          fi
          node ../tooling/scripts/release.mjs check-prerelease \
            --version "$VERSION" \
            --marketplace-json "$SHOW_JSON" \
            --changelog CHANGELOG.md \
            --head "$HEAD_SHA" \
            --tag-commit "$TAG_COMMIT" \
            "${RERUN[@]}"
          echo "Pre-releasing v${VERSION} from ${TARGET_REF} ($(git rev-parse --short HEAD))"

      # An older Worker drops keys a newer extension sends, so the Worker must be
      # live before the extension that uses it (deploy.yml deploys it first).
      # This workflow does not deploy it: that would put an unmerged branch's
      # Worker and D1 migrations into production, and moving the
      # telemetry-worker-deployed tag off main would confuse deploy.yml. It only
      # checks: does the ref change telemetry/ in ways the deployed Worker (the
      # tag) does not have? Three-dot diff = changes since the ref's merge-base
      # with the tag, so a ref that is merely behind main does not count.
      - name: Is the ref's telemetry Worker deployed?
        working-directory: ext
        env:
          TAG: telemetry-worker-deployed
          ALLOW: ${{ inputs.allow_undeployed_telemetry }}
        run: |
          if ! git rev-parse --quiet --verify "refs/tags/${TAG}^{commit}" > /dev/null; then
            CHANGED="(no ${TAG} tag: cannot tell what is deployed)"
          else
            CHANGED=$(git diff --name-only --no-renames "refs/tags/${TAG}...HEAD" -- telemetry ':(exclude,glob)telemetry/**/*.md')
          fi
          if [ -z "$CHANGED" ]; then
            echo "telemetry/ on ${TARGET_REF} adds nothing beyond the deployed Worker"
            exit 0
          fi
          echo "telemetry/ changes on ${TARGET_REF} that the deployed Worker does not have:"
          echo "$CHANGED"
          MESSAGE="${TARGET_REF} changes the telemetry Worker, and the deployed Worker would drop the new keys. Deploy it first: merge those telemetry/ changes to main on their own (deploy.yml then deploys the Worker and releases no extension), then re-run this. Or re-run with allow_undeployed_telemetry to accept losing the new keys until then."
          if [ "$ALLOW" = "true" ]; then
            echo "::warning::${MESSAGE}"
            exit 0
          fi
          echo "::error::${MESSAGE}"
          exit 1

      - run: npm ci
        working-directory: ext

      # The same checks deploy.yml runs before it packages.
      - name: Type check
        working-directory: ext
        run: npm run compile

      - name: Build
        working-directory: ext
        run: npm run build

      - name: Run tests
        working-directory: ext
        run: npm run test

      # Only this run's checkout gets the version: nothing is committed or
      # pushed, so no branch's package.json ever carries a pre-release number.
      - name: Set the version
        working-directory: ext
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Pin the release to this commit before anything is published, so a re-run
      # (Validate above) can prove it is finishing the same release. Validation has
      # already refused a published version whose tag marks another commit, so a
      # tag on another commit here is left by a run that never published (a
      # failed build, say): move it, unless a GitHub Release already uses it.
      # Created through the API; nothing is pushed.
      - name: Tag the release commit
        working-directory: ext
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="prerelease-v${VERSION}"
          HEAD_SHA=$(git rev-parse HEAD)
          if [ -z "$TAG_COMMIT" ]; then
            gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${HEAD_SHA}" > /dev/null
            echo "Tagged ${HEAD_SHA} as ${TAG}"
          elif [ "$TAG_COMMIT" = "$HEAD_SHA" ]; then
            echo "${TAG} already marks ${HEAD_SHA}"
          elif gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::${TAG} marks ${TAG_COMMIT} and has a GitHub Release, but this run built ${HEAD_SHA}. Use a new version."
            exit 1
          else
            echo "Moving ${TAG} from ${TAG_COMMIT} (a run that never published) to ${HEAD_SHA}"
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f "sha=${HEAD_SHA}" -F force=true > /dev/null
          fi

      # `vsce package` runs the vscode:prepublish hook (npm run package);
      # --pre-release marks the VSIX, and `vsce publish --pre-release` refuses a
      # VSIX that was not packaged that way.
      - name: Publish to VS Code Marketplace (pre-release)
        working-directory: ext
        env:
          AZURE_PAT: ${{ secrets.AZURE_PAT }}
        run: |
          VSIX="${RUNNER_TEMP}/erd-studio-${VERSION}.vsix"
          npx --yes @vscode/vsce package --pre-release --no-dependencies -o "$VSIX"
          npx --yes @vscode/vsce ls --no-dependencies > "${RUNNER_TEMP}/vsce-files.txt"
          COUNT=$(wc -l < "${RUNNER_TEMP}/vsce-files.txt" | tr -d ' ')
          echo "Publishing ${COUNT} files:"; cat "${RUNNER_TEMP}/vsce-files.txt"
          if [ "$COUNT" -gt 60 ]; then
            echo "::error::vsce would publish ${COUNT} files (limit 60) — check .vscodeignore"
            exit 1
          fi
          for attempt in 1 2 3; do
            if npx --yes @vscode/vsce publish --pre-release --packagePath "$VSIX" --pat "$AZURE_PAT" --skip-duplicate; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Publish attempt ${attempt} failed; retrying in $((attempt * 15)) seconds"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Marketplace publish failed after 3 attempts"
          exit 1

      # Same VSIX, same rules as deploy.yml: Open VSX is secondary, so a failure
      # here never blocks the Marketplace release or the GitHub Release.
      - name: Publish to Open VSX (pre-release)
        continue-on-error: true
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not set; skipping Open VSX"
            exit 0
          fi
          VSIX="${RUNNER_TEMP}/erd-studio-${VERSION}.vsix"
          for attempt in 1 2 3; do
            if npx --yes ovsx@1 publish --pre-release --packagePath "$VSIX" --pat "$OVSX_PAT" --skip-duplicate; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Open VSX attempt ${attempt} failed; retrying in $((attempt * 15)) seconds"
              sleep $((attempt * 15))
            fi
          done
          echo "::warning::Open VSX publish failed after 3 attempts; the Marketplace pre-release is unaffected"
          exit 1

      # Only after a successful publish. The tag is prerelease-v<version>, never
      # v<version> (the stable deploy's tags), and the release is a GitHub
      # pre-release that is never "Latest": the repo's Latest release stays the
      # stable one. The tag already marks the released commit (Tag the release
      # commit), and --verify-tag refuses to create one elsewhere. On a re-run an
      # existing release keeps the VSIX it has: a rebuild is never byte-identical
      # to the one on the Marketplace, so it only fills in a missing asset.
      - name: Create GitHub pre-release
        working-directory: ext
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="prerelease-v${VERSION}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          node ../tooling/scripts/release.mjs prerelease-notes --version "$VERSION" --changelog CHANGELOG.md > "$NOTES_FILE"
          {
            echo
            echo '---'
            echo
            echo "Built from \`${TARGET_REF}\` at $(git rev-parse --short HEAD). Install the pre-release from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=liamwynne.erd-studio) or [Open VSX](https://open-vsx.org/extension/liamwynne/erd-studio) with **Switch to Pre-Release Version**, or from the \`.vsix\` below with **Extensions: Install from VSIX…**."
          } >> "$NOTES_FILE"

          ASSET="${RUNNER_TEMP}/erd-studio-${VERSION}.vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qxF "$(basename "$ASSET")"; then
              echo "GitHub Release ${TAG} already exists with its VSIX; leaving it"
            else
              echo "GitHub Release ${TAG} already exists; attaching its VSIX"
              gh release upload "$TAG" "$ASSET"
            fi
          else
            gh release create "$TAG" "$ASSET" \
              --verify-tag \
              --prerelease \
              --latest=false \
              --title "v${VERSION} (pre-release)" \
              --notes-file "$NOTES_FILE"
          fi
