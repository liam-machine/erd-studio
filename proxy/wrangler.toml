# ERD Studio — hosted feedback-analysis proxy.
#
# Deployed by hand (see README.md). This directory is not part of the extension
# build and is excluded from the VSIX by the repo's .vscodeignore.

name = "erd-studio-feedback-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The public URL the extension's HOSTED_ANALYSIS_ENDPOINT points at. Put a
# custom domain in front of it if you would rather not ship a workers.dev
# hostname inside a published extension.
workers_dev = true

# Keeps the counts-only log lines (see `log()` in src/index.js) visible in the
# dashboard and in `wrangler tail`. No prompt or completion text is ever logged.
[observability]
enabled = true

# ---------------------------------------------------------------------------
# Bindings
# ---------------------------------------------------------------------------

# Holds the per-IP sliding windows (`ip:<hash>`) and the global daily counter
# (`day:<YYYY-MM-DD>`). Both are short-lived: every key is written with a TTL.
# Create it with `wrangler kv namespace create ANALYSIS_KV` and paste the id.
[[kv_namespaces]]
binding = "ANALYSIS_KV"
id = "1bb1c6e9232342a3a68997f27f633563"

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
#
# All optional: src/index.js has a default for each, and an unparseable or
# out-of-range value falls back to that default rather than to "unlimited".
# The API key is NOT here — it is a secret (`wrangler secret put`).

[vars]
# Kill switch. "off" (or "0"/"false"/"no"/empty, and the boolean `false` or the
# number 0) serves; ANY other value makes every request 503 immediately, with no
# KV read and no upstream call.
#
# THIS FILE IS THE SOURCE OF TRUTH. Every `wrangler deploy` re-applies the value
# below over whatever the dashboard says, so a dashboard flip lasts only until
# the next deploy. Flip it here and deploy for a change that sticks; see
# "The kill switch" in README.md for the deploy-proof stop (delete the secret).
KILL_SWITCH = "off"

# Upstream chat-completions API, and the only model this Worker will ask for.
# The client's `model` field is discarded and replaced with this one.
UPSTREAM_URL = "https://api.deepseek.com/chat/completions"
MODEL = "deepseek-chat"

# Caps. The extension's prompt is ~2-3 KB and its reply is a few hundred
# tokens; these are generous but finite.
MAX_BODY_BYTES = "24576"
MAX_UPSTREAM_BYTES = "262144"
MAX_TOKENS = "900"
MAX_MESSAGES = "8"

# Per-caller sliding window: IP_LIMIT requests per IP_WINDOW_SECONDS, plus a
# per-caller daily cap. IPv4 is bucketed by address, IPv6 by /64 — a whole /64
# belongs to one caller, and keying on the full address would give them 2^64
# fresh windows. The window is sized for real use (writing one description fires
# several debounced analyses); IP_DAILY_LIMIT is what stops one caller draining
# DAILY_BUDGET on their own. Both live in one KV entry, so they cost one write.
IP_LIMIT = "15"
IP_WINDOW_SECONDS = "300"
IP_DAILY_LIMIT = "60"

# Global budget for every caller together, per UTC day. This is the number that
# decides your bill — set it alongside the account spend cap, not instead of it.
#
# Each served request costs 2 KV writes, so on the Workers FREE plan (1,000 KV
# writes/day, reset 00:00 UTC) the effective ceiling is ~500/day regardless of
# what you put here — and blowing through the KV quota 503s every request until
# UTC midnight, it does not degrade to 429. 450 is the free-safe default. Move
# to Workers Paid before raising it.
DAILY_BUDGET = "450"

# Upstream timeout, in ms. The extension gives up at 20 s, so finish first.
UPSTREAM_TIMEOUT_MS = "18000"

# Salt for the stored IP hash — deliberately NOT here. This repo is public, and
# a published salt lets anyone recompute the hash for a given IP, which is the
# whole point of salting it. It is set as a secret instead:
#   npx wrangler secret put IP_HASH_SALT
# src/index.js falls back to an unsalted hash if it is missing, so the Worker
# still runs, just with weaker key privacy.
