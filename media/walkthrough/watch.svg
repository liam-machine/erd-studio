<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .ew-bg{fill:var(--vscode-editor-background,#1e1e1e)}
    .ew-card{fill:var(--vscode-editorWidget-background,#252526);stroke:var(--vscode-panel-border,#555555);stroke-width:1.5}
    .ew-fg{fill:var(--vscode-foreground,#cccccc)}
    .ew-muted{fill:var(--vscode-descriptionForeground,#999999)}
    .ew-rule{stroke:var(--vscode-panel-border,#555555)}
    .ew-btn{fill:var(--vscode-button-background,#0e639c)}
    .ew-btnfg{fill:var(--vscode-button-foreground,#ffffff)}
    .ew-link{fill:var(--vscode-textLink-foreground,#3794ff)}
  </style>
  <!-- player frame -->
  <rect x="40" y="28" width="400" height="244" rx="12" class="ew-card"/>
  <rect x="52" y="40" width="376" height="190" rx="6" class="ew-bg"/>
  <!-- mini ERD inside the video, dimmed -->
  <g opacity="0.55">
    <path d="M178 104 H240 M302 104 H240 V170 H302" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <g transform="translate(96 78)">
      <rect width="82" height="54" rx="4" class="ew-card"/>
      <path d="M0 4a4 4 0 0 1 4-4h74a4 4 0 0 1 4 4v10H0z" fill="#60a5fa"/>
      <rect x="8" y="22" width="52" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="32" width="40" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="42" width="58" height="4" rx="2" class="ew-muted"/>
    </g>
    <g transform="translate(302 78)">
      <rect width="82" height="54" rx="4" class="ew-card"/>
      <path d="M0 4a4 4 0 0 1 4-4h74a4 4 0 0 1 4 4v10H0z" fill="#60a5fa"/>
      <rect x="8" y="22" width="46" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="32" width="60" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="42" width="36" height="4" rx="2" class="ew-muted"/>
    </g>
    <g transform="translate(302 150)">
      <rect width="82" height="54" rx="4" class="ew-card"/>
      <path d="M0 4a4 4 0 0 1 4-4h74a4 4 0 0 1 4 4v10H0z" fill="#22c55e"/>
      <rect x="8" y="22" width="56" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="32" width="38" height="4" rx="2" class="ew-muted"/>
      <rect x="8" y="42" width="50" height="4" rx="2" class="ew-muted"/>
    </g>
  </g>
  <!-- play button -->
  <circle cx="240" cy="135" r="34" class="ew-btn"/>
  <path d="M230 117 L258 135 L230 153 Z" class="ew-btnfg"/>
  <!-- controls -->
  <path d="M64 252 l10 6 l-10 6 z" class="ew-fg"/>
  <line x1="88" y1="258" x2="380" y2="258" class="ew-rule" stroke-width="4" stroke-linecap="round"/>
  <line x1="88" y1="258" x2="170" y2="258" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="170" cy="258" r="6" class="ew-link"/>
  <text x="416" y="262" font-size="11" text-anchor="end" class="ew-muted">2:10</text>
</svg>
