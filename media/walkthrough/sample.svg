  <g fill="none" stroke="#60a5fa" stroke-width="1.5">
    <path d="M336 150 L268 70"/>
    <path d="M336 150 L404 70"/>
    <path d="M336 150 L268 230"/>
    <path d="M336 150 L404 230"/>
