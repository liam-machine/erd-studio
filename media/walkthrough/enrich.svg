<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <style>
    .ew-bg{fill:var(--vscode-editor-background,#1e1e1e)}
    .ew-card{fill:var(--vscode-editorWidget-background,#252526);stroke:var(--vscode-panel-border,#555555);stroke-width:1.5}
    .ew-fg{fill:var(--vscode-foreground,#cccccc)}
    .ew-muted{fill:var(--vscode-descriptionForeground,#999999)}
    .ew-link{fill:var(--vscode-textLink-foreground,#3794ff)}
    .ew-rule{stroke:var(--vscode-panel-border,#555555)}
  </style>
  <!-- model box -->
  <g transform="translate(96 36)">
    <rect width="220" height="168" rx="6" class="ew-card" stroke="#60a5fa" stroke-width="2"/>
    <path d="M0 6a6 6 0 0 1 6-6h208a6 6 0 0 1 6 6v24H0z" fill="#60a5fa" fill-opacity="0.3"/>
    <text x="14" y="20" font-size="13" font-weight="600" class="ew-fg">dim_customer</text>
    <g font-size="11">
      <!-- PK row -->
      <rect x="12" y="42" width="24" height="16" rx="3" fill="#60a5fa"/>
      <text x="24" y="54" font-size="9" font-weight="700" text-anchor="middle" fill="#0b1a2e">PK</text>
      <text x="46" y="54" class="ew-fg">customer_id</text>
      <text x="206" y="54" text-anchor="end" class="ew-muted">int</text>
      <line x1="12" y1="68" x2="208" y2="68" class="ew-rule" stroke-width="1"/>
      <!-- FK row -->
      <rect x="12" y="78" width="24" height="16" rx="3" fill="#22c55e"/>
      <text x="24" y="90" font-size="9" font-weight="700" text-anchor="middle" fill="#052e14">FK</text>
      <text x="46" y="90" class="ew-fg">region_id</text>
      <text x="206" y="90" text-anchor="end" class="ew-muted">int</text>
      <line x1="12" y1="104" x2="208" y2="104" class="ew-rule" stroke-width="1"/>
      <!-- plain rows -->
      <rect x="12" y="114" width="24" height="16" rx="3" fill="none" stroke="var(--vscode-panel-border,#555555)" stroke-dasharray="3 2"/>
      <text x="46" y="126" class="ew-fg">full_name</text>
      <text x="206" y="126" text-anchor="end" class="ew-muted">string</text>
      <line x1="12" y1="140" x2="208" y2="140" class="ew-rule" stroke-width="1"/>
      <text x="46" y="158" class="ew-muted">signup_date</text>
      <text x="206" y="158" text-anchor="end" class="ew-muted">date</text>
    </g>
  </g>
  <!-- grain note -->
  <g transform="translate(96 220)">
    <rect width="220" height="44" rx="6" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="14" y="18" font-size="9" font-weight="700" letter-spacing="0.08em" fill="#60a5fa">GRAIN</text>
    <text x="14" y="34" font-size="11" class="ew-fg">One row per customer</text>
  </g>
  <!-- AI sparkles -->
  <g class="ew-link">
    <path d="M372 82 C374 100 380 106 398 108 C380 110 374 116 372 134 C370 116 364 110 346 108 C364 106 370 100 372 82 Z"/>
    <path d="M410 54 C411 62 414 65 422 66 C414 67 411 70 410 78 C409 70 406 67 398 66 C406 65 409 62 410 54 Z" opacity="0.75"/>
    <path d="M404 146 C405 151 407 153 412 154 C407 155 405 157 404 162 C403 157 401 155 396 154 C401 153 403 151 404 146 Z" opacity="0.55"/>
  </g>
  <!-- dashed trail from sparkle to the badges -->
  <path d="M346 112 C330 112 320 100 316 94" fill="none" stroke="var(--vscode-textLink-foreground,#3794ff)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>
</svg>
