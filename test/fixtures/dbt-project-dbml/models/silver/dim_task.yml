version: 2
models:
  - name: dim_task
    description: Task dimension table
    config:
      tags:
        - silver
        - domain:showcase
    columns:
      - name: task_key
        description: Surrogate key for task
        tests:
          - relationships:
              to: ref('fct_sale')
              field: amount
      - name: project_key
        description: FK to dim_project
      - name: name
        description: Task name
      - name: status
        description: Current status
        data_type: STRING
