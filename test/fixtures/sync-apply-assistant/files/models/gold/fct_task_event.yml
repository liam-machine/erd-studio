version: 2
models:
  - name: fct_task_event
    description: Task events fact table
    config:
      tags:
        - gold
        - daily
        - domain:tasks
        - domain:showcase
    columns:
      - name: event_id
        description: Event surrogate key
      - name: task_key
        description: FK to dim_task
      - name: event_date
        description: Date of the event
      - name: amount
        description: Event amount
      - name: customer_key
        description: FK to dim_customer
        data_type: INT
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_key
      - name: project_key
        description: FK to dim_project
        data_type: INT
        tests:
          - relationships:
              to: ref('dim_project')
              field: project_key
