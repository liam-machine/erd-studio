
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'jhg_edp'
version: '1.0.0'
config-version: 2

# Define the project variables which are used in dbt macros to reduce hardcoding
vars:
  check_cols_excluded_cols: [
    'audit_from_timestamp', 
    'audit_to_timestamp', 
    'audit_last_modified_timestamp', 
    'audit_row_hash', 
    'audit_active_ind', 
    'audit_src_stream', 
    'audit_src_processed_timestamp', 
    'audit_src_file_name', 
    'audit_tgt_load_timestamp', 
    'audit_process_id', 
    'audit_delete_flag'
  ]
  debug_mode: false
  power_user_groups: ['Databricks - Data Engineers','Databricks - Service Principals']

# This setting configures which "profile" dbt uses for this project.
profile: 'jhg_edp_dev'

# These configurations specify where dbt should look for different types of files.
# The `source-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/ directory
# as tables. These settings can be overridden in the individual model files
# using the `{{ config(...) }}` macro.
models:
  jhg_edp:
    +docs:
      node_color: chocolate
    # Applies to all files under models/example/
    bronze_fleetsu:
      views:
        +materialized: view
      +schema: bronze_fleetsu
    bronze_acs:
      +schema: bronze_acs
    bronze_ad:
      +schema: bronze_ad
    bronze_dbo:
      +schema: bronze_dbo
    bronze_eds:
      +schema: bronze_eds
    bronze_fms:
      +schema: bronze_fms
    bronze_pcr:
      +schema: bronze_pcr
    bronze_pfr:
      +schema: bronze_pfr
    bronze_powerbi:
      +schema: bronze_powerbi
    bronze_pp:
      +schema: bronze_pp
    bronze_soteria:
      +schema: bronze_soteria
    bronze_controlpro:
      +schema: bronze_controlpro
    bronze_lmr:
      +schema: bronze_lmr
    bronze_p6bld:
      +schema: bronze_p6bld
    bronze_p6nwpa:
      +schema: bronze_p6nwpa
    bronze_p6ric:
      +schema: bronze_p6ric
    bronze_p6mtro:
      +schema: bronze_p6mtro
    bronze_p6cyp:
      +schema: bronze_p6cyp
    bronze_p6jhg:
      +schema: bronze_p6jhg
    bronze_p6etp:
      +schema: bronze_p6etp
    bronze_p6m7m12:
      +schema: bronze_p6m7m12
    bronze_p6nwth:
      +schema: bronze_p6nwth
    bronze_p6rna:
      +schema: bronze_p6rna
    bronze_p6pre:
      +schema: bronze_p6pre
    bronze_p6srlg:
      +schema: bronze_p6srlg
    bronze_p6t2d:
      +schema: bronze_p6t2d
    bronze_mars:
      +schema: bronze_mars
    silver:
      +schema: silver
      +docs:
        node_color: slategray
      +persist_docs:
        relation: true
        columns: true
      dim:
        +pre-hook: "{{ populate_foreign_keys() }}"
        +post-hook: "{{ alter_table_for_rls() }}"
      fct:
        +pre-hook: "{{ populate_foreign_keys() }}"
        +post-hook: "{{ alter_table_for_rls() }}"    
      factless_fct:
        +tags: source-security-exempt
        +materialized: jhg_table
        +updated_at: audit_from_timestamp
        +dedup_enabled: true
      ref:
        +pre-hook: "{{ populate_foreign_keys() }}"
      stg:
        +tags: source-security-exempt
        +materialized: table
        +docs:
          node_color: slateblue
    gold_nwpa:
      +schema: gold_nwpa
      +materialized: jhg_gold_view
    gold:
      +schema: gold
      +materialized: jhg_gold_view
      +docs:
        node_color: gold
      +persist_docs:
        relation: true
        columns: true
      fct:
        +post-hook: "{{ alter_table_for_rls() if 'infrastructure-quality' in config.get('tags', []) and 'gold-tables' in config.get('tags', []) else '' }}"
      stg:
        +post-hook: "{{ alter_table_for_rls() if 'infrastructure-quality' in config.get('tags', []) and 'gold-tables' in config.get('tags', []) else '' }}"
    archived_tables:
      +schema: archived_tables
    audit:
      +schema: audit
      +docs:
        node_color: purple
      dim:
        +materialized: view
        +tags: ops-dashboard
      fct:
        +materialized: incremental
        +on_schema_change: append_new_columns
        +tags: ops-dashboard
      ref:
        +materialized: table
        +tags: ops-dashboard
    utils:
      +pre-hook: 
          - "{{ get_edp_engineer_alias() }}"
          - '{{ table_rls_project_filter_ppw("utils") }}'
          - '{{ table_rls_asset_group_filter_fleetsu("utils") }}'
          - '{{ table_rls_financial_project_filter_pcr("utils") }}'
          - '{{ get_project_secret() }}'
          - '{{ get_fleetsu_secret() }}'
          - '{{ get_pcr_secret() }}'
          - '{{ workspace_project_filter() }}'
          - '{{ workspace_fleetsu_filter() }}'
          - '{{ workspace_pcr_filter() }}'
      +schema: utils
      +materialized: table
      +tags:
        - utils
  elementary:
    +schema: audit
    +enabled: "{{ target.name != 'dev' }}"

seeds:
  jhg_edp:
    +schema: silver
    rls:
      +schema: utils
    audit_refs:
      +schema: utils
      +tags: ops-dashboard
    pbi_suite_navigation:
      +schema: bronze_powerbi

data_tests:
  jhg_edp:
    silver:
      dim:     
        +where: " audit_active_ind = 'Y' and audit_delete_flag != 'Y' and audit_last_modified_timestamp > getdate() - interval 28 days "
      fct:     
        +where: " audit_active_ind = 'Y' and audit_delete_flag != 'Y' and audit_last_modified_timestamp > getdate() - interval 28 days "
    gold:
      +severity: warn 

on-run-start:  
  - '{{ create_schema("functions") }}'                      # Will create a schema `functions` to store all UDF for processing json
  - '{{ make_func_json_get_child_value("functions") }}'     # Will create the UDF in the created schema
# These configurations are to set up Cloud CLI
# Source: https://docs.getdbt.com/docs/cloud/configure-cloud-cli
