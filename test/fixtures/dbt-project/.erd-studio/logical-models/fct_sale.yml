name: fct_sale
schema: silver
description: Sales transaction fact table
grain: One row per sale transaction
modelRole: transaction-fact
columns:
  - name: sale_id
    dataType: INT
    description: Sale id from the source system — a degenerate dimension, and this fact's own key
    isPrimaryKey: true
    isNaturalKey: true
  - name: project_key
    dataType: INT
    description: FK to dim_project
    isForeignKey: true
  - name: amount
    dataType: DECIMAL
    description: Sale amount
    additiveType: additive
