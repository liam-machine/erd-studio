name: dim_location
schema: silver
description: Location dimension — exists only in logical (missing from conceptual and physical)
grain: One row per location
modelRole: domain-dim
rationale:
  purpose: Site reference for location-scoped reporting
columns:
  - name: location_key
    dataType: INT
    description: Surrogate key — warehouse-generated, one per row
    isPrimaryKey: true
    scdType: 0
  - name: location_code
    dataType: VARCHAR
    description: Business location code from the source system
    isNaturalKey: true
    scdType: 0
  - name: site_name
    dataType: VARCHAR
    description: Site name — not unique, so never a key
    scdType: 1
  - name: latitude
    dataType: JSON
    description: GPS latitude
  - name: longitude
    dataType: FLOAT
    description: GPS longitude
